name: Publish books

on:
  push:
    tags:
      - 'books-*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-build.txt
      - run: python -m pip install -r .github/requirements-build.txt
      - name: Build and validate all books
        shell: bash
        run: |
          set -euo pipefail
          for manifest in generated/*/book.json; do
            story="$(dirname "$manifest")"
            python .skills/tim-story-production/scripts/build_epub.py "$story"
            python .skills/tim-story-production/scripts/build_pdf.py "$story"
          done
      - name: Publish permanent editions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Мышонок Тим — $RELEASE_TAG" \
              --notes 'EPUB и PDF всех сказок. Собраны из book.json и мастер-иллюстраций соответствующего тега; каждый файл прошёл встроенную проверку сборщика.'
          fi
          gh release upload "$RELEASE_TAG" _dist/*/*.epub _dist/*/*.pdf --clobber
          gh release edit "$RELEASE_TAG" --draft=false
