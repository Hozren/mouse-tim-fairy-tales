name: Build changed stories

on:
  push:
    branches: ["**"]
    tags: ["books-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect changed stories
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.stories.outputs.matrix }}
      count: ${{ steps.stories.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build story matrix
        id: stories
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_DELETED: ${{ github.event.deleted }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$REF_TYPE" == "tag" ]]; then
            python3 .github/scripts/detect_changed_stories.py \
              --event manual \
              --github-output "$GITHUB_OUTPUT"
          else
            deleted_arg=()
            if [[ "$REF_DELETED" == "true" ]]; then
              deleted_arg+=(--deleted)
            fi
            python3 .github/scripts/detect_changed_stories.py \
              --event "$EVENT_NAME" \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --default-branch "$DEFAULT_BRANCH" \
              --ref-name "$REF_NAME" \
              "${deleted_arg[@]}" \
              --github-output "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.slug }}
    needs: detect
    permissions:
      contents: write
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-build.txt

      - name: Install PDF dependencies
        run: python -m pip install --requirement .github/requirements-build.txt

      - name: Build EPUB and PDF
        env:
          STORY_DIR: ${{ matrix.path }}
          STORY_SLUG: ${{ matrix.slug }}
        run: |
          mkdir -p "_dist/$STORY_SLUG"
          python3 .skills/tim-story-production/scripts/build_epub.py "$STORY_DIR" \
            --output "_dist/$STORY_SLUG/$STORY_SLUG.epub"
          python3 .skills/tim-story-production/scripts/build_pdf.py "$STORY_DIR" \
            --output "_dist/$STORY_SLUG/$STORY_SLUG.pdf"

      - name: Publish EPUB and PDF as separate release assets
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref_name == github.event.repository.default_branch || github.ref_type == 'tag')
        env:
          GH_TOKEN: ${{ github.token }}
          STORY_SLUG: ${{ matrix.slug }}
          SOURCE_SHA: ${{ github.sha }}
          STORY_DIR: ${{ matrix.path }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="story-${STORY_SLUG}-${SOURCE_SHA}"
          story_title=$(python3 -c 'import json, os; from pathlib import Path; print(json.loads((Path(os.environ["STORY_DIR"]) / "book.json").read_text())["title"])')
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" --target "$SOURCE_SHA" --draft \
              --title "$story_title" \
              --notes "EPUB и PDF отдельными файлами, без ZIP. Исходники: $SOURCE_SHA. Оба формата прошли встроенные проверки сборщиков."
          fi
          gh release upload "$release_tag" \
            "_dist/$STORY_SLUG/$STORY_SLUG.epub" \
            "_dist/$STORY_SLUG/$STORY_SLUG.pdf" --clobber
          gh release edit "$release_tag" --draft=false --latest=false --title "$story_title"
