<div class="title">
<p class="p">Анна Казалис</p>
<p class="p">Мышонок Тим не хочет чистить зубы</p>
</div>
<span><div class="image">
<img class="z1" alt="" src="images/i_002.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_003.jpg"/>
</div><p class="empty-line"/><p class="p1">Topo Tip non vuole lavarsi i denti</p><p class="p1">From an idea by <div class="image">
<img class="z1" alt="" src="images/i_004.png"/>
</div> Andrea Dami</p><p class="p1">Illustrations by Marco Campanella</p><p class="p1">Texts by Anna Casalis</p><p class="p1">Graphic design by Stefania Pavin</p><p class="p1">© 2021 Giunti Editore S.p.A., Milano-Firenze Dami International, a brand of Giunti Publishing Group www.giunti.it</p><p class="p1">© ООО «РОСМЭН», 2021</p></span>
<span><p class="subtitle">* * *</p><p class="p1">Мышонок Тим всегда хорошо ел, но сегодня почему-то раскапризничался.</p><p class="p1">– Я не буду огурцы! И помидоры мне не нравятся. А салатные листья вообще фу! – кричит Тим. – Я хочу пирожные, торт, конфеты и вафли с кремом!</p><p class="p1">Тим сердито отвернулся. Усики у него подрагивают от возмущения.</p><p class="p1">– Ну хорошо, Тим, – сдаётся мама. Она очень устала сегодня. – Давай так: ты съешь салат, а потом получишь кусочек торта. Хотя, вообще-то, много сладкого есть вредно – зубы испортишь.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_005.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим поужинал, пора ложиться спать.</p><p class="p1">– Перед сном надо обязательно умыться и хорошенько почистить зубки, – напоминает мама.</p><p class="p1">– Да знаю я, знаю, – ворчит Тим.</p><p class="p1">Но как только мама уходит, Тим выплёвывает пасту и бросает щётку.</p><p class="p1">Он не любит чистить зубы. Это скучно и ни капельки не интересно!</p><p class="p1">«И вообще, они и так чистые!» – говорит себе Тим.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_006.jpg"/>
</div><p class="empty-line"/><p class="p1">Когда мама приходит пожелать Тиму спокойной ночи, он старается не открывать рот – вдруг она заметит кусочки еды между зубами.</p><p class="p1">И тут мама говорит:</p><p class="p1">– Завтра вы с папой пойдёте к зубному. Он проверит твои зубки.</p><p class="p1">Ой-ой-ой! Тим заволновался.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_007.jpg"/>
</div><p class="empty-line"/><p class="p1">А вот папа, похоже, совсем не волнуется!</p><p class="p1">Когда они с Тимом пришли к врачу, папа смело сел в кресло и широко открыл рот, чтобы доктору было удобнее заглянуть внутрь.</p><p class="p1">Ого, какие белые у папы зубы!</p><p class="p1">– Всё в порядке, – сказал доктор. – А теперь заглянем в ротик этого храброго мышонка.</p><p class="p1">Но Тим не хочет показывать зубки. Он боится.</p><p class="p1">– Кресло слишком высокое, я в него не залезу! – хитрит Тим.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_008.jpg"/>
</div><p class="empty-line"/><p class="p1">Доктор нажимает на педаль, и кресло опускается – в самый раз для мышонка!</p><p class="p1">Тим сел, но крепко сжал зубы и даже зажмурился. Никто к нему в рот не заглянет!</p><p class="p1">Но доктор хитрый.</p><p class="p1">– Такой храбрый мышонок, наверно, может открыть рот шире самого храброго льва?</p><p class="p1">Ха! Конечно, может!</p><p class="p1">Тим тут же открывает рот широко-широко, и доктор осматривает его зубки.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_009.jpg"/>
</div><p class="empty-line"/><p class="p1">– М-да, видно, что кое-кто не дружит с зубной щёткой, – говорит доктор. – Но пока зубки белые и здоровые. Всё в порядке.</p><p class="p1">Тим очень удивился. Он думал, его будут ругать.</p><p class="p1">На прощание доктор дал Тиму книжку и сказал:</p><p class="p1">– Посмотри внимательно на картинки, и научишься ухаживать за своими зубками.</p><p class="p1">Книжки с картинками Тим любит!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_010.jpg"/>
</div><p class="empty-line"/><p class="p1">Книжка оказалась очень интересная. Мышонок Тим долго изучал картинки и узнал, как ухаживать за зубками, чтобы они не болели и всегда были белыми и крепкими.</p><p class="p1">Но… тут же всё забыл!</p><p class="p1">У него есть дела поважнее: сегодня к нему пришёл его друг бурундучок Джоди. Он всегда выдумывает страшно увлекательные игры! Правда, маме идеи Джоди часто не нравятся.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_011.jpg"/>
</div><p class="empty-line"/><p class="p1">На этот раз Джоди даже останется у них ночевать. У Тима ещё никогда раньше не ночевал никто из друзей!</p><p class="p1">Джоди надел пижаму, а зубы чистить не стал.</p><p class="p1">– Да ну! – сказал он. – Не буду я тратить время на такую ерунду!</p><p class="p1">– А в книжке написано… – начал Тим, но Джоди его перебил:</p><p class="p1">– Ты книжке будешь верить или мне? Я вот никогда не чищу зубы, и посмотри: они не хуже, чем у тебя.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_012.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим и Джоди легли в кроватки, но спать не хотят.</p><p class="p1">– А давай устроим пижамную вечеринку, – предлагает Джоди.</p><p class="p1">– Как это?</p><p class="p1">Тим о таком никогда не слышал. Но у Джоди есть старшие братья и сёстры, от них он много чего узнаёт.</p><p class="p1">– Это когда ночью не спят, а едят всякие вкусности, – говорит Джоди и достаёт из рюкзачка коробку с печеньем.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_013.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим взял парочку, Джоди съел всё остальное.</p><p class="p1">А утром…</p><p class="p1">– У-у-у-у-у! Как больно!</p><p class="p1">Джоди схватился за щёку и стонет – щека вся распухла.</p><p class="p1">Ого! Тим такое уже видел – в той книжке с картинками, которую дал зубной врач.</p><p class="p1">– У тебя зуб болит, это из-за печенья! – говорит Тим.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_014.jpg"/>
</div><p class="empty-line"/><p class="p1">А вот и мама Джоди пришла за ним. Джоди кинулся к ней и плачет.</p><p class="p1">– Это всё печенье виновато! – спешит объяснить ей Тим. – Печенье плохое – от него болят зубы!</p><p class="p1">– Тим, ну что ты такое говоришь? – смеётся мама. – Печенье не виновато. Ничего плохого нет в том, чтобы съесть немножко печенья. Главное – не забывать чистить зубы. Крошки застревают между зубами, и в зубах появляются дырочки, вот от этого зубки и болят! Но не переживай. Доктор починит Джоди зубик.</p><p class="p1">– Я всегда-всегда буду чистить зубы! – всхлипывает Джоди.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_015.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим тоже так решил! Он ещё раз внимательно посмотрел картинки в книжке и теперь каждое утро и каждый вечер старательно чистит зубки один за другим:</p><p class="p1">    снизу вверх,</p><p class="p1">        справа налево,</p><p class="p1">            а теперь по кругу.</p><p class="p1">Чух-чух! – как будто поезд.</p><p class="p1">Вжиу! Вжиу! – сегодня Тим самолёт.</p><p class="p1">«И вовсе это не скучно, – думает мышонок Тим и вспоминает, как у Джоди распухла щека. – А главное, это очень важное и нужное дело!»</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_016.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_017.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_018.jpg"/>
</div></span>
