<div class="title">
<p class="p">Анна Казалис</p>
<p class="p">Мышонок Тим. Я никуда не поеду!</p>
</div>
<span><div class="image">
<img class="z1" alt="" src="images/i_002.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_003.jpg"/>
</div><p class="empty-line"/><p class="p1">Topo Tip. Io resto a casa!</p><p class="p1">From an idea by <div class="image">
<img class="z1" alt="" src="images/i_004.png"/>
</div> Andrea Dami</p><p class="p1">Illustrations by Marco Campanella</p><p class="p1">Texts by Anna Casalis</p><p class="p1">Graphic design by Stefania Pavin</p><p class="p1">© 2022 Giunti Editore S.p.A., Milano-Firenze Dami International, a brand of Giunti Publishing Group</p><p class="p1">Graphic design by Stefania Pavin</p><p class="p1">www.giunti.it</p><p class="p1">© ООО «РОСМЭН», 2022</p></span>
<span><p class="subtitle">* * *</p><p class="p1">С самого утра мама и папа листают брошюры и выбирают, куда поехать в отпуск. А Тиму не хочется никуда ехать, и брошюры смотреть не хочется – он бы лучше играл на улице.</p><p class="p1">– Вот тут, кажется, неплохо, – говорит мама и показывает картинку.</p><p class="p1">– Да, верно, – кивает папа. – Думаю, мы там хорошенько отдохнём за эти две недели.</p><p class="p1">Лили, сестрёнка Тима, радостно хохочет. Но Тим недоволен.</p><p class="p1">– Не хочу никуда ехать! – кричит он. – Две недели – это же целая вечность! Там не будет моих друзей! Не хочу без друзей!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_005.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим убежал в комнату, сел и надулся. Мама пришла его утешать.</p><p class="p1">– Ну чего ты, Тим? – говорит она. – Ты же не знаешь, как там будет. Может, тебе понравится.</p><p class="p1">– Не понравится! – ворчит Тим. – Без друзей, без игрушек! Мои игрушки ведь останутся здесь?</p><p class="p1">– Все игрушки мы взять не сможем, но самые нужные – бери, пожалуйста.</p><p class="p1">И мама дала Тиму маленький чемоданчик! Как раз ему по размеру.</p><p class="p1">– Ого! Это мне? Специальный чемоданчик только для моих игрушек, да? – радуется Тим.</p><p class="p1">– Ну конечно, малыш.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_006.jpg"/>
</div><p class="empty-line"/><p class="p1">– Я возьму машинки, и кубики, и мяч, и карандаши, я всё-всё-всё возьму! – бормочет Тим, собирая игрушки.</p><p class="p1">– Лишь бы чемоданчик закрылся, – смеётся мама.</p><p class="p1">Разумеется, всё-всё-всё взять не удалось. Но некоторые игрушки Тим уложил в чемоданчик, и теперь будущее путешествие кажется ему не таким плохим.</p><p class="p1">И вот день отъезда настал. Папа загрузил в багажник сумки и чемоданы.</p><p class="p1">– Так много вещей! – ахнул Тим. – А мой чемоданчик поместится?</p><p class="p1">– Поместится, не переживай, – говорит папа. – Главное – ещё коляску Лили не забыть.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_007.jpg"/>
</div><p class="empty-line"/><p class="p1">И вот все в машине: Тим и Лили в детских креслах на заднем сиденье, мама впереди на пассажирском, а папа за рулём.</p><p class="p1">– Пристегнулись? – спрашивает папа. – Тогда в путь!</p><p class="p1">Машина поехала, а Тим снова вспомнил друзей. Он будет очень скучать без них. Ему опять кажется, что в поездке ничего хорошего не будет.</p><p class="p1">Ехать долго. Тим и Лили задремали.</p><p class="p1">Вдруг машина остановилась.</p><p class="p1">– Мы уже на месте? – сонно бормочет Тим.</p><p class="p1">– Нет, просто в пробку попали, – вздыхает мама.</p><p class="p1">Стоять в пробке скучно.</p><p class="p1">– Мне надоело сидеть! – жалуется Тим. – И я хочу пи́сать!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_008.jpg"/>
</div><p class="empty-line"/><p class="p1">Ничего не поделаешь: придётся потерпеть. На автомагистрали нельзя остановиться где хочешь – для этого есть специальные места.</p><p class="p1">– Как только увидим место для отдыха, сразу остановимся, – обещает папа и добавляет: – Ещё и заправиться надо.</p><p class="p1">– И хорошо бы перекусить, – подхватывает мама.</p><p class="p1">Наконец они вышли из машины. Мама отвела малышей в туалет, а потом они все вместе расположились на полянке и устроили пикник.</p><p class="p1">«В дороге всё вкуснее», – думает Тим, уплетая бутерброд с вареньем.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_009.jpg"/>
</div><p class="empty-line"/><p class="p1">Потом папа с Тимом поиграли немного в футбол. Но надо ехать дальше.</p><p class="p1">Дорога кажется Тиму бесконечной. Он вспоминает своих друзей – как долго они не увидятся! Даже игры, которые придумывают мама с папой, его не радуют.</p><p class="p1">Только вечером они наконец остановились у высокого дома.</p><p class="p1">– Вот мы и на месте! – объявил папа. – Теперь надо перетаскать вещи.</p><p class="p1">– Не хочу ничего таскать, – ворчит Тим.</p><p class="p1">– Мы сами перетаскаем, – улыбается мама. – Иди лучше посмотри, где мы будем жить.</p><p class="p1">Тим схватил свой чемоданчик и побежал в дом.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_010.jpg"/>
</div><p class="empty-line"/><p class="p1">Мама отвела его в квартиру. Вот кухня, вот ванная, вот гостиная…</p><p class="p1">– А где я буду спать? – спрашивает Тим.</p><p class="p1">– В спальне, конечно, – говорит папа.</p><p class="p1">Тим заглядывает ещё в одну комнату. Там стоят три кровати: большая для мамы с папой и две маленькие – для него и для Лили.</p><p class="p1">– Ура! Мы все будем спать в одной комнате! – радуется Тим.</p><p class="p1">День был длинный, все очень устали. Но прежде чем ложиться спать, надо поужинать.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_011.jpg"/>
</div><p class="empty-line"/><p class="p1">Мама, папа, Тим и Лили пришли в ресторан. Официант проводил их за столик, принёс меню.</p><p class="p1">– Будешь овощной суп? – спрашивает мама у Тима.</p><p class="p1">Тим кивает. Он очень проголодался.</p><p class="p1">– Минестроне, – объявляет официант, ставя тарелку перед Тимом.</p><p class="p1">«Какой ещё минестроне?» – насупился Тим.</p><p class="p1">– Я это не буду! Я хотел овощной суп! – кричит мышонок.</p><p class="p1">– Так это он и есть, – смеётся мама. – Просто так называется. Попробуй.</p><p class="p1">Тим попробовал – в самом деле, не так, как готовит мама, но тоже очень вкусно.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_012.jpg"/>
</div><p class="empty-line"/><p class="p1">На следующее утро Тим проснулся и сперва даже не понял, где он. Только потом вспомнил, как они ехали долго-долго и наконец добрались сюда.</p><p class="p1">Мама тоже проснулась.</p><p class="p1">– Сейчас приму душ и сделаю нам завтрак. Хорошо?</p><p class="p1">– Ладно, – говорит Тим. – Только Тедди тоже будет завтракать.</p><p class="p1">Ой, а где же Тедди? Дома Тим всегда кладёт своего игрушечного мишку возле подушки, но сейчас в кровати его нет.</p><p class="p1">– Тедди потерялся! – Тим уткнулся в подушку и плачет. – Я хочу домой!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_013.jpg"/>
</div><p class="empty-line"/><p class="p1">Тук-тук-тук. Кто-то стучит в дверь.</p><p class="p1">– Тим, иди сюда, – зовёт мама.</p><p class="p1">Тим вытер слёзы и бросился в коридор.</p><p class="p1">На пороге стоит енотик, в руках у него Тедди!</p><p class="p1">– Привет, меня зовут Тео, я нашёл мишку на парковке. Это случайно не твой? – спрашивает енотик.</p><p class="p1">– Мой! Спасибо! – кричит Тим, хватая Тедди.</p><p class="p1">Видимо, Тим выронил его вчера, когда вылезал из машины, и не заметил. Как хорошо, что Тео его нашел и принёс!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_014.jpg"/>
</div><p class="empty-line"/><p class="p1">– Тим, не хочешь предложить Тео поиграть потом вместе? – говорит мама.</p><p class="p1">Вообще-то Тим рад бы прямо сейчас поиграть, но мама сказала, что надо сперва поесть. К тому же папа и Лили ещё спят – нельзя шуметь.</p><p class="p1">Но вот все собрались за завтраком. Булочки с маслом и вареньем, молоко – совсем как дома. Но самое главное – Тедди тут! Тим очень рад, что его мишка нашёлся.</p><p class="p1">– Мама, Тео меня, наверно, уже ждёт! – беспокоится Тим.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_015.jpg"/>
</div><p class="empty-line"/><p class="p1">– Сейчас все соберёмся и выйдем, – говорит мама. – Я возьму купальники.</p><p class="p1">– А я – тележку для игрушек Тима, – смеётся папа.</p><p class="p1">Тим аж приплясывает от радости. Ему всё нравится: и новое место, и то, что тут его любимые игрушки, и мама с папой, и Лили… и, кажется, у него появился новый друг.</p><p class="p1">«Да, всё-таки куда-нибудь поехать не так уж плохо», – думает Тим.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_016.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_017.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_018.jpg"/>
</div></span>
