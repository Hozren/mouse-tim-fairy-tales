<div class="title">
<p class="p">Анна Казалис</p>
<p class="p">Мышонок Тим. Не бойся!</p>
</div>
<span><div class="image">
<img class="z1" alt="" src="images/i_002.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_003.jpg"/>
</div><p class="empty-line"/><p class="p1">Topo Tip non vuole andare all’asilo</p><p class="p1">From an idea by <div class="image">
<img class="z1" alt="" src="images/i_004.png"/>
</div> Andrea Dami</p><p class="p1">Illustrations by Marco Campanella</p><p class="p1">Texts by Anna Casalis</p><p class="p1">Graphic design by Stefania Pavin</p><p class="p1">© 2018 Giunti Editore S.p.A., Milano-Firenze Dami International, a brand of Giunti Publishing Group www.giunti.it</p><p class="p1">© ООО «РОСМЭН», 2019</p></span>
<span><p class="subtitle">* * *</p><p class="p1">Уже вечер, но мышонку Тиму не хочется спать. Он разглядывает картинки в книжке, своей любимой – с монстрами и привидениями.</p><p class="p1">«Вот так монстры!» – думает Тим.</p><p class="p1">– Не надо на ночь смотреть страшные картинки, – говорит мама.</p><p class="p1">– А мне не страшно! Гляди, какие они смешные! – хохочет мышонок. – Это противный Чёрный рыцарь, видишь? – Тим тычет пальцем в картинку.</p><p class="p1">– Ну ладно, не боишься – вот и хорошо, – говорит мама. – Спокойной ночи! – И выключает свет.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_005.jpg"/>
</div><p class="empty-line"/><p class="p1">– Мама, не выключай! Я люблю, когда светло!</p><p class="p1">– Ты что, боишься темноты?</p><p class="p1">– Нет, конечно! – говорит Тим, хотя на самом деле ему всё же страшновато.</p><p class="p1">В комнате темно. Тим закрывает глаза, открывает: никакой разницы! Но постепенно мышонок привыкает к темноте… и видит какие-то странные тени. Там, в углу, кто-то есть! Кто же это? О нет! Чёрный рыцарь!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_006.jpg"/>
</div><p class="empty-line"/><p class="p1">– Ма-а-а-а-а-ама! – в ужасе кричит мышонок.</p><p class="p1">Мама тут же прибегает.</p><p class="p1">– Что случилось, Тим?</p><p class="p1">– Вон, смотри! Там Чёрный рыцарь! – плачет испуганный мышонок.</p><p class="p1">Мама включает свет… никого. Нет там Чёрного ры-царя – только вешалка с одеждой.</p><p class="p1">– Тим, у нас в доме нет никаких монстров. И ночью у тебя в комнате всё то же самое, что и днём, – объясняет мама. – Здесь никто тебя не обидит.</p><p class="p1">И мышонок Тим краснеет: надо же так испугаться вешалки!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_007.jpg"/>
</div><p class="empty-line"/><p class="p1">Но на этом беды нашего мышонка не заканчиваются.</p><p class="p1">На следующее утро во дворе детского сада он налетает на компанию «старших», которые вечно над ним смеются.</p><p class="p1">– Не путайся под ногами! Малышам здесь не место! Иди отсюда, а не то мы тебе хвост оторвём! – кричат они и хохочут.</p><p class="p1">Тим убежал, забился в уголок и тихонько плачет. Ему ужасно обидно… Скорее бы стать большим и сильным! Тогда он всем покажет!</p><p class="p1">«Больше никогда-никогда не пойду в детский сад!» – решает Тим.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_008.jpg"/>
</div><p class="empty-line"/><p class="p1">Наконец-то его забирают. Ну и денёк! За ним пришли мама и папа.</p><p class="p1">– Почему старшие меня обижают? – спрашивает мышонок Тим у папы. – Я же не сделал им ничего плохого. Я их боюсь…</p><p class="p1">– Просто хоть они и большие, но глупые и трусливые! Не переживай, Тим, ты лучше их! И не забывай, что они тоже совсем недавно были малышами. Знаешь, когда я был маленьким, у нас в школе были такие мальчишки. Но мой папа объяснил мне, что бояться их не стоит, но и самому не надо задирать малышей.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_009.jpg"/>
</div><p class="empty-line"/><p class="p1">Мышонок Тим утёр слёзы. Ему уже не так грустно. Мама принесла ему плавки. После сада они идут в бассейн.</p><p class="p1">Тим не знает, радоваться или огорчаться: он даже в ванне боится купаться, если много воды!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_010.jpg"/>
</div><p class="empty-line"/><p class="p1">Когда они приходят в бассейн, Тиму становится совсем страшно.</p><p class="p1">– Не хочу плавать! – хнычет он и цепляется за мамину юбку. – И вода наверняка холодная!</p><p class="p1">Уже и тренер по плаванию пытается уговорить мышонка залезть в бассейн, но Тим кричит:</p><p class="p1">– Нет! Я не умею плавать! Я утону! Мама, пойдём отсюда!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_011.jpg"/>
</div><p class="empty-line"/><p class="p1">– Ты боишься, Тим? – мягко спрашивает мама.</p><p class="p1">Приходится Тиму признаться: да, он боится!</p><p class="p1">Тогда мама надевает купальник и сама залезает в бассейн.</p><p class="p1">– Иди ко мне на ручки, Тим! Увидишь, это так здорово! – говорит она и поднимает мышонка повыше, чтобы он не глотнул воды. – Смотри, теперь я ложусь на воду. Вот видишь, вода меня держит, как матрас!</p><p class="p1">Тиму уже не так страшно: он на миг отпускает мамины руки… Ого! Вода и его тоже держит!</p><p class="p1">– Молодец, Тим! – хвалит его мама. – Скоро ты и плавать научишься!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_012.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим загребает одной лапкой, потом другой, молотит по воде изо всех сил и доплывает до бортика. А потом обратно к маме!</p><p class="p1">– Ура! Я умею плавать! – радостно кричит он.</p><p class="p1">И тут Тим замечает малыша, который боится зайти в воду.</p><p class="p1">– Не плачь, плавать совсем не страшно! – говорит ему Тим. – Хочешь научу?</p><p class="p1">Время летит быстро, и вот уже пора уходить. Мышонок Тим оглядывается, но мамы нигде нет. Куда она делась? Он тут никого не знает, ему страшно одному…</p><p class="p1">На самом деле он, конечно, не один. Морж, который работает в бассейне, помогает малышам вылезти из воды и провожает их в раздевалку. Но мышонок так перепугался, что даже моржа не заметил.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_013.jpg"/>
</div><p class="empty-line"/><p class="p1">– Не плачь, мышонок! – говорит ему морж. – Твоя мама пошла переодеваться, она сейчас вернётся… Беги с остальными в раздевалку!</p><p class="p1">Но мышонок Тим никак не может успокоиться. Наконец он видит маму и кидается её обнимать.</p><p class="p1">– Мамочка, не бросай меня больше!</p><p class="p1">– Как же я тебя брошу, малыш? Я всегда рядом, не бойся! А если мне нужно уйти, я никогда не оставлю тебя просто так – кто-нибудь из взрослых за тобой обязательно приглядит. А теперь бежим скорей домой: кажется, вот-вот начнётся дождь!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_014.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_015.jpg"/>
</div><p class="empty-line"/><p class="p1">Ба-бах!</p><p class="p1">Как страшно грохочет и как близко! У Тима шёрстка на ушах встала дыбом.</p><p class="p1">Прыг – и он уже у мамы на ручках!</p><p class="p1">– Не бойся, Тим! Это всего лишь гром, – успокаивает его мама.</p><p class="p1">Но мышонок зажмуривается и затыкает лапами уши. Вот бы оказаться поскорее дома!</p><p class="p1">– Кто это так громко кричит, там, наверху, в облаках? – в ужасе спрашивает он.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_016.jpg"/>
</div><p class="empty-line"/><p class="p1">– Кричит? – улыбается мама. – Что ты, Тим! Гром – это просто шум. Его не стоит бояться, а вот с молниями надо быть осторожным. Во время грозы нельзя стоять под деревьями, потому что молния может в них ударить. А теперь бежим домой, а не то промокнем до нитки!</p><p class="p1">Наконец мышонок Тим в безопасности. По стёклам барабанит дождь, но дома уютно и тепло. А вот маленькая сестрёнка Тима почему-то плачет в своей кроватке.</p><p class="p1">– Ты боишься грома? – спрашивает Тим. – Не бойся. Он нам ничего не сделает. К тому же я с тобой!</p><p class="p1">Мама берёт малышку на ручки и укачивает.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_017.jpg"/>
</div><p class="empty-line"/><p class="p1">– Знаешь, мама, теперь я больше ничего не боюсь! – гордо говорит мышонок Тим. – Я могу спать в темноте, я умею плавать и грозы не боюсь!</p><p class="p1">– Молодец, Тим! Я очень за тебя рад, – хвалит его папа. Он как раз вернулся с работы. – Но запомни: никогда не смейся над теми, кто боится. Бояться чего-то непонятного – не стыдно. И даже полезно: иначе можно попасть в беду.</p><p class="p1">Тим устроился у папы на коленях и заявил:</p><p class="p1">– Но всё равно сейчас, когда вы с мамой рядом, я ничего не боюсь!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_018.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_019.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_020.jpg"/>
</div><p class="empty-line"/><div class="image">

</div></span>
