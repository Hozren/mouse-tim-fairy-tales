<div class="title">
<p class="p">Анна Казалис</p>
<p class="p">Мышонок Тим. Мама на работе</p>
</div>
<span><div class="image">
<img class="z1" alt="" src="images/i_002.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_003.jpg"/>
</div><p class="empty-line"/><p class="p1">Topo Tip. Mamma, non andare a lavorare!</p><p class="p1">From an idea by <div class="image">
<img class="z1" alt="" src="images/i_004.png"/>
</div> Andrea Dami</p><p class="p1">Illustrations by Marco Campanella</p><p class="p1">Texts by Anna Casalis</p><p class="p1">Graphic design by Stefania Pavin</p><p class="p1">© 2021 Giunti Editore S.p.A., Milano-Firenze Dami International, a brand of Giunti Publishing Group www.giunti.it</p><p class="p1">© ООО «РОСМЭН», 2020</p></span>
<span><p class="subtitle">* * *</p><p class="p1">У мышонка Тима очень хорошая мама. Она всегда играет с ним, читает ему сказки.</p><p class="p1">Вот, например, сегодня утром мышонок крикнул:</p><p class="p1">– Мама, ищи меня!</p><p class="p1">Мама бросила все дела и стала искать Тима.</p><p class="p1">– Тим, Тим! Где ты?</p><p class="p1">Но Тим хорошо спрятался: сидит и не отзывается.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_005.jpg"/>
</div><p class="empty-line"/><p class="p1">Вечером мама и папа сели считать деньги. Ой, как много всего нужно, а денег совсем мало.</p><p class="p1">Тим видит, что они беспокоятся.</p><p class="p1">– Пожалуй, мне пора выйти на работу, – говорит мама. – Тим ведь уже большой и ходит в садик.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_006.jpg"/>
</div><p class="empty-line"/><p class="p1">Мама просматривает газету. Она ищет работу.</p><p class="p1">– Тут столько интересных предложений! – говорит она. – Поможешь мне набирать номера?</p><p class="p1">Тим рад помочь. Мама подсказывает, какие цифры набирать, и Тим набирает. Вот какая интересная игра!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_007.jpg"/>
</div><p class="empty-line"/><p class="p1">– Ура! Меня приняли! – кричит мама. Она очень довольна. – Завтра я пойду на работу!</p><p class="p1">И Тиму становится грустно. Теперь эта игра ему совсем не нравится.</p><p class="p1">– Мамочка, ты что, больше не хочешь со мной быть? Не хочешь играть со мной? Ты меня больше не любишь?</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_008.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_009.jpg"/>
</div><p class="empty-line"/><p class="p1">На следующий день мама ведёт Тима в детский сад. Тим смотрит на маму. Она выглядит не так, как обычно. Она оделась по-другому, потому что идёт на работу.</p><p class="p1">– Мама, не бросай меня! – просит он.</p><p class="p1">– Не плачь, Тим! – говорит мама. – Вот увидишь: всё будет хорошо.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_010.jpg"/>
</div><p class="empty-line"/><p class="p1">– Эй, Тим! Твоя мама теперь работает? – спрашивают Тима друзья в детском саду.</p><p class="p1">– Моя мама тоже ходит на работу! – говорит Зайка. – Она медсестра в больнице.</p><p class="p1">– А моя – учительница!</p><p class="p1">– А моя мама работает в газете! – кричат дети.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_011.jpg"/>
</div><p class="empty-line"/><p class="p1">– Все профессии нужные, – говорит воспитательница. – Давайте каждый выберет, кем хочет сегодня быть.</p><p class="p1">– Я буду пожарным!</p><p class="p1">– Я – актрисой!</p><p class="p1">– А я – учёным!</p><p class="p1">– Я буду доктором, – говорит Тим.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_012.jpg"/>
</div><p class="empty-line"/><p class="p1">Зайка, как настоящая актриса, читает стихотворение. А Топотун – путешественник. Он смотрит в бинокль. Что же он видит? Пухлика, который сегодня пожарный.</p><p class="p1">А мышонок Тим лечит Тедди.</p><p class="p1">– Дышите. Не дышите, – говорит он и слушает.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_013.jpg"/>
</div><p class="empty-line"/><p class="p1">Мама Тима пришла забрать его из детского садика – как обычно.</p><p class="p1">Тим бежит к ней со всех лап.</p><p class="p1">– Ты хорошо работала? А что это за коробка? А я сегодня тоже работал. Я был доктором! – хвастается Тим.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_014.jpg"/>
</div><p class="empty-line"/><p class="p1">– Ты больше не расстраиваешься, что я пошла на работу? – спрашивает мама и крепко обнимает Тима.</p><p class="p1">– Немножко. Но не сильно, – отвечает Тим. – Я теперь знаю, что работа – это очень важно. И вообще другие мамы тоже работают.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_015.jpg"/>
</div><p class="empty-line"/><p class="p1">Мама с Тимом приходят домой и наконец открывают жёлтую коробку.</p><p class="p1">– М-м-м-м! Сколько вкусненького! Откуда это? – спрашивает Тим и облизывается.</p><p class="p1">– С работы. А знаешь, где я работаю? На кондитерской фабрике. Там делают сладости!</p><p class="p1">– Ничего себе мне повезло! – хохочет Тим.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_016.jpg"/>
</div><p class="empty-line"/><p class="p1">– Пап, а мама совсем не изменилась, хотя и пошла на работу, – говорит Тим перед сном. – Сегодня было много хорошего, даже больше, чем обычно!</p><p class="p1">– Это замечательно, Тим. А теперь засыпай, и пусть тебе приснится, кем ты станешь, когда вырастешь, и какая у тебя будет хорошая, интересная работа.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_017.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_018.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_019.jpg"/>
</div></span>
