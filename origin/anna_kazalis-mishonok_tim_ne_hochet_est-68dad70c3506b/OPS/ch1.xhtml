<div class="title">
<p class="p">Анна Казалис</p>
<p class="p">Мышонок Тим не хочет есть</p>
</div>
<span><div class="image">
<img class="z1" alt="" src="images/i_002.jpg"/>
</div><p class="empty-line"/><p class="p1">Topo Tip non vuole mangiare</p><p class="p1">From an idea by <div class="image">
<img class="z1" alt="" src="images/i_003.png"/>
</div> Andrea Dami</p><p class="p1">Illustrations by Marco Campanella</p><p class="p1">Texts by Anna Casalis</p><p class="p1">Graphic design by Stefania Pavin</p><p class="p1">© 2018 Giunti Editore S.p.A., Milano-Firenze Dami International, a brand of Giunti Publishing Group www.giunti.it</p><p class="p1">© ООО «РОСМЭН», 2019</p></span>
<span><p class="subtitle">* * *</p><p class="p1">Зимний вечер. На улице метель. Мышонок Тим стоит у окна со своим игрушечным медвежонком.</p><p class="p1">– О-о-о-о! Сколько снега! – радуется Тим. – Завтра с утра слепим большущего снеговика и будем кататься с горки, да, Тедди?</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_004.jpg"/>
</div><p class="empty-line"/><p class="p1">– Ти-и-им! – зовёт мама. – Скорее мой лапы и садись за стол!</p><p class="p1">Мама повязала Тиму слюнявчик, и Тедди тоже. Они вместе будут ужинать.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_005.jpg"/>
</div><p class="empty-line"/><p class="p1">– Гляди, я приготовила сегодня кое-что очень вкусное, – говорит мама и наливает ему полную тарелку морковного супа.</p><p class="p1">Но Тим не хочет есть. Лучше бы он сидел у окна и смотрел, как кружатся снежинки.</p><p class="p1">– Я не буду! Есть скучно! – бубнит Тим и складывает лапки на груди.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_006.jpg"/>
</div><p class="empty-line"/><p class="p1">– Что ты, Тим? Это же твой любимый морковный суп! – уговаривает его мама.</p><p class="p1">– Не хочу! Я разлюбил морковку! У неё дурацкий цвет! – ноет Тим. Голос у него дрожит, и две слезинки скатываются по щекам.</p><p class="p1">– Надо есть, Тим. Иначе у тебя не будет сил, ты не сможешь играть и гулять.</p><p class="p1">– Ну и пусть! – ворчит Тим. – Всё равно!</p><p class="p1">– Может быть, ты хочешь сыр? – предлагает мама.</p><p class="p1">– Нет! Сыр я тоже не люблю!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_007.jpg"/>
</div><p class="empty-line"/><p class="p1">Это неправда. Все мышата любят сыр, и Тим его просто обожает, но сейчас ему кажется, что он вообще ничего не любит: ни морковку, ни сыр, ни пшеничные зёрнышки.</p><p class="p1">Он встаёт со стула и отправляется в свою комнату, волоча за собой медвежонка.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_008.jpg"/>
</div><p class="empty-line"/><p class="p1">– Конфеты! Вот что я буду есть! – заявляет мышонок. – Конфеты есть интересно!</p><p class="p1">– Но ты же не можешь есть только одни конфеты! – говорит мама. – От конфет портятся зубки.</p><p class="p1">– Ну и пусть!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_009.jpg"/>
</div><p class="empty-line"/><p class="p1">Тук-тук-тук!</p><p class="p1">Что это? Кто-то стучится в окно. Кто бы это мог быть?</p><p class="p1">– Эй, хозяева! Откройте, пожалуйста! Мне очень-очень холодно!</p><p class="p1">Тим с удивлением разглядывает кузнечика за окном, а мама уже пошла открывать.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_010.jpg"/>
</div><p class="empty-line"/><p class="p1">– Простите, я ужасно замёрз, устал и проголодался. Нет ли у вас ложечки горячего супа или корочки сыра? – спрашивает кузнечик.</p><p class="p1">– Конечно есть! Правда, некоторые мышата уверяют, что у морковного супа дурацкий цвет, а сыр невкусный. – Мама косится на мышонка, и Тим краснеет.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_011.jpg"/>
</div><p class="empty-line"/><p class="p1">Мама налила кузнечику суп и дала хлеба с сыром.</p><p class="p1">– Ох, как вкусно! Это вам не конфеты! А то я с утра только конфеты и ел, – жалуется кузнечик.</p><p class="p1">Тим удивляется. Неужели мамин суп вкуснее конфет? А гость так быстро орудует ложкой и так причмокивает, что Тим начинает жалеть, что отказался от супа.</p><p class="p1">– Зря ты не ешь суп, – говорит кузнечик мышонку. – Я вон не ел весь день – даже петь не могу. А мне на концерт!</p><p class="p1">– На концерт? – ахнул Тим.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_012.jpg"/>
</div><p class="empty-line"/><p class="p1">– Ну да! Я у вас в городке должен спеть сегодня вечером. Вот я с утра собрался, а завтракать не стал. Решил, что не хочу. Взял с собой конфет и пошёл. Только на конфетах долго не протянешь. Замёрз я ужасно. Когда голодный, всегда холоднее. Я сто раз пожалел, что не поел. Хорошо, что вы меня покормили!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_013.jpg"/>
</div><p class="empty-line"/><p class="p1">– А вы нам споёте? – спрашивает мышонок.</p><p class="p1">– Теперь запросто!</p><p class="p1">И кузнечик спел им песню про мышат, которые любят сыр и морковку и растут большими и сильными.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_014.jpg"/>
</div><p class="empty-line"/><p class="p1">Потом кузнечик поблагодарил их, попрощался и ушёл.</p><p class="p1">– Можно мне немножко супа? – попросил мышонок.</p><p class="p1">У него вдруг проснулся аппетит.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_015.jpg"/>
</div><p class="empty-line"/><p class="p1">– Конечно, малыш!</p><p class="p1">Тим быстро съел всё до последней крошки и, довольный, облизал усики.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_016.jpg"/>
</div><p class="empty-line"/><p class="p1">– Ну что, наелся, мой маленький? Всё скушал? – говорит мама и обнимает Тима.</p><p class="p1">– Это я нарочно поел, чтобы завтра у меня были силы слепить снеговика и покататься с горки. Я Тедди обещал! Мы ещё позавтракаем хорошо, и точно не замёрзнем! – заявляет Тим, и мама улыбается.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_017.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_018.jpg"/>
</div></span>
