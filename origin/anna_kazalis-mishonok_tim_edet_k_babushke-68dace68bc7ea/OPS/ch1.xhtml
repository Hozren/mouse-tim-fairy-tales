<div class="title">
<p class="p">Анна Казалис</p>
<p class="p">Мышонок Тим едет к бабушке</p>
</div>
<span><div class="image">
<img class="z1" alt="" src="images/i_002.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_003.jpg"/>
</div><p class="empty-line"/><p class="p1">Topo Tip non vuole dormire dai nonni</p><p class="p1">From an idea by <div class="image">
<img class="z1" alt="" src="images/i_004.png"/>
</div> Andrea Dami</p><p class="p1">Illustrations by Marco Campanella</p><p class="p1">Texts by Anna Casalis</p><p class="p1">Graphic design by Stefania Pavin</p><p class="p1">© 2021 Giunti Editore S.p.A., Milano-Firenze Dami International, a brand of Giunti Publishing Group www.giunti.it</p><p class="p1">© ООО «РОСМЭН», 2020</p></span>
<span><p class="subtitle">* * *</p><p class="p1">Сегодня папа мышонка Тима пришёл с работы очень радостный.</p><p class="p1">– Гляди, что у меня есть! – крикнул он, размахивая какими-то листочками. – Это билеты на самолёт! Мы летим отдыхать!</p><p class="p1">Мама Тима захлопала в ладоши.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_005.jpg"/>
</div><p class="empty-line"/><p class="p1">Мама с папой обсуждают, что хотят посмотреть, и складывают вещи.</p><p class="p1">Тим тоже бежит собирать чемоданчик.</p><p class="p1">– Ура! Мы едем, едем! А куда мы едем?</p><p class="p1">Тим очень рад. Но папа вдруг говорит:</p><p class="p1">– Это мы с мамой едем отдыхать, а ты пока поживёшь у бабушки с дедушкой.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_006.jpg"/>
</div><p class="empty-line"/><p class="p1">– Но я не хочу к бабушке с дедушкой! – ноет мышонок Тим. – Я хочу полететь на самолёте вместе с вами!</p><p class="p1">– Тим, ты уже большой, – говорит мама, вытаскивая из чемоданчика Тима всё, что он туда сложил. – Ты можешь пожить несколько дней без нас. Бабушка с дедушкой будут о тебе заботиться.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_007.jpg"/>
</div><p class="empty-line"/><p class="p1">Мама и папа отвезли мышонка Тима в деревню к бабушке с дедушкой.</p><p class="p1">Но мышонок Тим на них даже не смотрит. Он вцепился в маму и не отпускает.</p><p class="p1">– Мама, папа, пожалуйста, возьмите меня с собой!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_008.jpg"/>
</div><p class="empty-line"/><p class="p1">Мама с папой всё равно уехали.</p><p class="p1">Бабушка сажает мышонка Тима к себе на колени, гладит его по спинке и утешает.</p><p class="p1">– Хочу к маме! Хочу к папе! – плачет Тим, хотя у бабушки на ручках хорошо и уютно. А из кухни пахнет чем-то вкусным…</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_009.jpg"/>
</div><p class="empty-line"/><p class="p1">– Смотри, Тим! Бабушка приготовила ужин специально для своего самого любимого мышонка на свете!</p><p class="p1">На столе стоит всё, что Тим любит. Тут и вкусный сыр с огромными дырками, и кусок пармезана в форме мышонка, и торт со сливками. От одного вида всего этого даже у медвежонка Тедди слюнки текут.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_010.jpg"/>
</div><p class="empty-line"/><p class="p1">После ужина дедушка достал книжку со сказками. Тим сидит у него на коленях, рассматривает картинки и помогает ему переворачивать странички.</p><p class="p1">– Жили-были… – начинает дедушка, и Тим внимательно слушает.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_011.jpg"/>
</div><p class="empty-line"/><p class="p1">Вот и пора ложиться спать. И тут Тим снова начинает скучать по маме.</p><p class="p1">– Когда она вернётся? – спрашивает он бабушку.</p><p class="p1">– Скоро, – говорит бабушка. Включает ночник и поёт мышонку колыбельную. – Спи, малыш. Мы с дедушкой очень рады, что ты к нам приехал.</p><p class="p1">Мышонок Тим засыпает.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_012.jpg"/>
</div><p class="empty-line"/><p class="p1">Наступило утро. Солнце встало.</p><p class="p1">Тим быстро-быстро выскочил из постели и со всех лап побежал к бабушке с дедушкой.</p><p class="p1">– Просыпайтесь! Просыпайтесь! Петух уже прокукарекал! Пойдёмте скорее во двор посмотрим, вылупились цыплята или нет!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_013.jpg"/>
</div><p class="empty-line"/><p class="p1">Днём мышонок Тим катается на тракторе.</p><p class="p1">– Бабуля, смотри! Я еду на тракторе! – кричит он.</p><p class="p1">Тим ужасно доволен. Он сидит у дедушки на коленях и помогает ему рулить. Бабушка им машет.</p><p class="p1">«Как здо́рово в деревне!» – думает Тим.</p><p class="p1">– Я теперь совсем большой! – говорит Тим бабушке с дедушкой. – За три дня я научился так много всего делать. Мама с папой меня, наверно, даже не узнают, когда вернутся!</p><p class="p1">– Узнают! – смеётся бабушка.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_014.jpg"/>
</div><p class="empty-line"/><p class="p1">А вот и мама с папой.</p><p class="p1">– Я ездил на тракторе и смотрел на маленьких цыпляток, – хвастается Тим. – И ел бабушкин торт! А когда вы меня снова привезёте к бабушке с дедушкой?</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_015.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_016.jpg"/>
</div><p class="empty-line"/><div class="image">
