<div class="title">
<p class="p">Анна Казалис</p>
<p class="p">Мышонок Тим приучает сестренку к горшку</p>
</div>
<span><div class="image">
<img class="z1" alt="" src="images/i_002.jpg"/>
</div><p class="empty-line"/><p class="p1">Художник Марко Кампанелла</p><p class="p1">Пересказ Надежды Конча</p><p class="empty-line"/><p class="p1">Topo Tip. Ciao ciao, pannolino!</p><p class="p1">from an idea by <div class="image">
<img class="z1" alt="" src="images/i_003.jpg"/>
</div> Andrea Dami</p><p class="p1">Copyright © 2024 Giunti Editore S.p.A., Firenze-Milano</p><p class="p1">www.giunti.it</p><p class="p1">© ООО «РОСМЭН», 2024</p></span>
<span><p class="subtitle">* * *</p><p class="p1">– Тим, пора домой, – говорит мама минут через десять. – Надо сменить подгузник твоей сестрёнке!</p><p class="p1">– Как – домой? – возмущается мышонок Тим. – Мы же только начали играть!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_004.jpg"/>
</div><p class="empty-line"/><p class="p1">По дороге мышонок Тим бурчит себе под нос:</p><p class="p1">– Вечно Лили мешает! Я никогда не могу из-за неё играть сколько хочу! Всегда ей что-то нужно. Когда она уже научится пи́сать в горшок, а не в подгузник!</p><p class="p1">Мышонок Тим очень сердится. Позавчера они не пошли в парк, потому что сестрёнка простудилась. Вчера маме пришлось отвести её к врачу. И вот сегодня вроде бы всё в порядке, и мышонок Тим мог бы наконец поиграть в парке, но нет… Младшая сестра снова всё испортила!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_005.jpg"/>
</div><p class="empty-line"/><p class="p1">Мама попросила Тима выбросить грязный подгузник, а сама помыла малышку и присы́пала присыпкой.</p><p class="p1">– Фу! Он воняет просто ужасно! – жалуется Тим, зажав нос лапой. – Как такая крошечная мышка может наложить такую огромную кучу! Бе-е-е! Надеюсь, мама права и Лили скоро научится ходить на горшок!</p><p class="p1">Мышонок Тим злится не только из-за грязного подгузника. На самом деле он немножко завидует сестре – ведь мама уделяет ей столько внимания!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_006.jpg"/>
</div><p class="empty-line"/><p class="p1">– Потерпи, Тим! – утешает его мама. – Лили ведь ещё совсем малышка. Вот увидишь, она обязательно научится пользоваться горшком. В её возрасте ты…</p><p class="p1">– Я научился очень быстро! – перебивает маму Тим.</p><p class="p1">Но, судя по всему, мама отлично помнит, как было дело. Она молча качает головой. Тим не стал спорить. Наверняка мама права.</p><p class="p1">– Тим, пригляди за малышкой, ты же её старший брат. А мне нужно позвонить по телефону, – говорит мама.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_007.jpg"/>
</div><p class="empty-line"/><p class="p1">Мышонок Тим решил нарядиться пиратом – раз уж не получилось поиграть в парке. Это его любимая игра. В шляпе и с саблей он очень похож на отважного капитана, грозу морей и океанов. Йо-хо-хо!</p><p class="p1">– Я вызываю вас на бой! – кричит он, делая вид, будто сейчас с кем-то сразится.</p><p class="p1">Сестрёнка смотрит на него, широко раскрыв глазки. И… наливает ему чай в игрушечную чашку.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_008.jpg"/>
</div><p class="empty-line"/><p class="p1">– Бросай свои девчачьи игры! – воскликнул Тим, которому надоело играть одному. – Лучше смотри и запоминай, как ведут себя настоящие пираты!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_009.jpg"/>
</div><p class="empty-line"/><p class="p1">Младшая сестра довольна – не так уж часто Тим предлагает ей поиграть вместе. Но не успели капитан Тим и его помощница высадиться на необитаемом острове, как…</p><p class="p1">– А-а-а-а-а! – заплакала Лили.</p><p class="p1">Тим с удивлением смотрит на неё. Странно. Что это с ней такое? Может, она решила, что он – настоящий пират, и испугалась? Ой, кажется, от её розовых ползунков неприятно пахнет. Тим отлично знает этот запах.</p><p class="p1">– Ну вот, опять! – раздражённо воскликнул мышонок Тим.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_010.jpg"/>
</div><p class="empty-line"/><p class="p1">– Мам! Ма-а-ам! – крикнул Тим.</p><p class="p1">Но мама занята – она говорит по телефону и не слышит своего сына. А малышка продолжает плакать.</p><p class="p1">– Что же делать? – пробормотал Тим.</p><p class="p1">Впрочем, такие мелкие неприятности не остановят настоящего пирата! Мышонок Тим подхватил свою маленькую сестрёнку и осторожно положил на пеленальный столик. Хм, как это делала мама? Тим же сто раз видел!</p><p class="p1">– Так, сначала снимаем грязный подгузник. Теперь надо смазать кремом и посыпать присыпкой… Нет, наверное, сначала надо было тебя помыть… А куда девать старый подгузник? Ой, присыпка рассыпалась, теперь в ней весь пол! МА-МА-А!</p><p class="p1">Тим в отчаянии. Он катается по полу, не зная, что делать. А младшая сестрёнка удивлённо смотрит на него с пеленального столика.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_011.jpg"/>
</div><p class="empty-line"/><p class="p1">К счастью, тут с работы вернулся папа.</p><p class="p1">– Что случилось? – спросил он, заходя в детскую.</p><p class="p1">Но у Тима нет сил ему всё объяснять.</p><p class="p1">– Давай-ка я всё сделаю, – предложил папа, пытаясь не рассмеяться.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_012.jpg"/>
</div><p class="empty-line"/><p class="p1">Малышка радостно вскрикнула. А Тим наконец может отдохнуть. Захватить чужой корабль и расправиться с врагами намного проще, чем поменять сестре подгузник!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_013.jpg"/>
</div><p class="empty-line"/><p class="p1">Ну вот, сестрёнка больше не плачет, и Тим собирается раз и навсегда решить вопрос с подгузниками.</p><p class="p1">– Если хочешь со мной играть, ты должна научиться делать свои дела в горшок. Ведь нам, взрослым, не нужен подгузник! – объясняет Тим младшей сестре.</p><p class="p1">Она, конечно, не всё поняла, но готова на что угодно, лишь бы порадовать своего любимого старшего братца.</p><p class="p1">– Придумал! Давай залезем на чердак. У меня есть для тебя подарок! – говорит Тим.</p><p class="p1">Малышка счастлива – она обожает подарки!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_014.jpg"/>
</div><p class="empty-line"/><p class="p1">На чердаке стоит большой сундук, в котором мама хранит старые вещи Тима: игрушки, одежду, карнавальные костюмы. Они все достанутся Лили, когда она до них дорастёт.</p><p class="p1">– Вот, смотри! Это мой горшок. Когда-то я делал в него свои дела, – говорит Тим и показывает сестрёнке горшок в виде жёлтого утёнка. – А пока я на нём сидел, мама читала мне сказки. Точно-точно! Так и было! Теперь твоя очередь учиться: ты сядешь на него, а я тебе почитаю. Вот увидишь: у тебя всё получится!</p><p class="p1">Малышка радостно улыбается: какая интересная игра! Вот бы поскорее сесть на этого милого утёнка!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_015.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим и его младшая сестрёнка спустились в гостиную. Мышонок посадил малышку на горшок, а сам взял свою любимую книжку и принялся читать про мишку-почтальона. Тиму кажется, что он уже совсем взрослый и важный! Лили спокойно сидит на горшке и слушает брата. Вдруг она радостно вскрикивает, и Тиму становится понятно, что дело сделано.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_016.jpg"/>
</div><p class="empty-line"/><p class="p1">– Молодчина! – радостно хвалит её старший брат. – Мама, папа! Посмотрите!</p><p class="p1">Все поздравляют малышку и, конечно, мышонка Тима, ведь он это тоже заслужил!</p><p class="p1">Теперь младшей сестрёнке Тима не нужны подгузники и ползунки, она может наряжаться в красивые платьица и гулять долго-долго.</p><p class="p1">Мышонок Тим очень гордится собой:</p><p class="p1">– Я ведь хороший брат, правда?</p><p class="p1">– Самый лучший! – хором отвечают ему мама с папой.</p><p class="p1">– И сестрёнка у меня тоже молодец! – кричит Тим и, схватив Лили за руку, добавляет: – А теперь пойдёмте гулять в парк!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_017.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_002.jpg"/>
</div></span>
