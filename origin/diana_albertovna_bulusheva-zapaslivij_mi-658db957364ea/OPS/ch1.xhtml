<div class="title">
<p class="p">Диана Булушева</p>
<p class="p">Запасливый мышонок Тим</p>
</div>
<span><p class="p1">В зелёном-зелёном в лесу в красивом маленьком домике жила семья мышек. Мышонок Тим и его родители, мама Мила и папа Мирон. Мышонок просто обожал собирать всякие «нужные и очень полезные предметы». Интересные упаковки от печенья, красивые крышечки от банок варенья, старая чашка без ручки и ещё много-много всего хранилось у него в комнате. Он никогда не позволял маме выкинуть хоть что-то из своих вещей, заверяя ее, что это ему просто необходимо. А еще у Тима было полно не только хороших игрушек, но и уже давно сломанных, с которыми Тим ни в какую не хотел расставаться. В комнате Тима накопилось столько этих «полезных вещей», что до кроватки можно было дойти только по тоненькой тропинке, оставшегося свободного места на полу. Потому, что копить вещи он очень любил, а вот содержать их в порядке нет.</p><p class="p1">— Тим, давай всё же разберём беспорядок в твоей комнате. Ведь тут невозможно ничего найти — говорила мама.</p><p class="p1">— Мам, ну это вовсе не беспорядок, все эти вещи мне очень-очень нужны. Правда. Посмотри, какой блестящий камешек, а какая красивая, изогнутая ветка и все эти разноцветные нитки мне тоже обязательно пригодятся. — возражал мышонок, обнимая лапками свои сокровища.</p><p class="p1">Мама вздыхала, и окинув взглядом комнату уходила ни с чем. Она понимала, что для мышонка его комната это целый мир и что он действительно очень дорожит тем, что взрослым кажется ненужными вещами. Но также она понимала, что беспорядок и горы предметов мешают Тиму быть внимательным и быстро находить, то, что ему необходимо.</p><p class="p1">А Тим, то и дело что-то терял и не мог найти сам. Он постоянно просил, то маму, то папу помочь ему с поисками. Неудивительно, ведь в таком море вещей очень сложно что-то найти. К тому же он то и дело отвлекался, на новое занятие, попадавшееся ему на глаза, совершенно забыв, чем он занимался до этого.</p><p class="p1">Однажды Тим участвовал в конкурсе поделок. Он смастерил замечательный кораблик, из веточек и большого сухого листа, который служил парусом. Он раскрасил его синим цветом, а на палубу поставил целую команду моряков-желудей. Тим был очень доволен своей работой и надеялся занять призовое место. Тим с нетерпением ждал финал конкурса целую неделю. И вот наконец-то завтра выберут победителя, нужно было прийти и принести поделку на полянку, где соберутся все участники и жюри. Мама приготовила поделку и поставила на видное место, чтобы Тиму не пришлось её искать.</p><p class="p1">Наступило утро, Тим проснулся, умылся, почистил зубки, позавтракал и оделся. Осталось взять поделку и отправиться на полянку ведь уже совсем скоро будут подводить итоги конкурса. Тим был в прекрасном настроении и очень ждал финал.</p><p class="p1">— Мам, дай мне мою поделку. — сказал мышонок.</p><p class="p1">— Малыш, она на столе в твоей комнате. — ответила мама.</p><p class="p1">Тим пошёл в свою комнату, но на столе поделки не оказалось.</p><p class="p1">— Ма-а-а-м, её нет — Тим начал беспокоиться.</p><p class="p1">Мама тоже пришла в его комнату, действительно на столе поделки не было.</p><p class="p1">— Дорогой, но вчера вечером я поставила поделку на стол, я специально приготовила твой кораблик, чтобы тебе не пришлось его искать.</p><p class="p1">— О-о-о, мам, кажется я вспомнил. Вчера перед сном я играл с корабликом. Но куда же я его подевал? — сокрушенно проговорил мышонок.</p><p class="p1">Он осмотрел свою комнату, но на глаза попадалось всё что угодно кроме кораблика. Стакан с карандашами и альбом, настольная игра и кубики, плюшевый медведь и машинка, веточки, сухие листья, камушки, крышечки и фантики, этикетки, части, уже давно поломанных, игрушек. А ещё баночки и коробочки, линза от очков, шнурок, старый кошелёк, у которого не работала молния, кусок проволоки, катушка от ниток, целая горсть разноцветных пуговиц… Всё кроме поделки. Тим нахмурился, все эти нужные вещи, уже не казались такими нужными, как раньше. Время все бежало и бежало, а поделка так и не находилась. Они с мамой поднимали вещи, открывали коробки, перекладывали всё с места на место, но поделка словно исчезла. Тим сел на кровать и закрыл мордочку лапками.</p><p class="p1">— Всё, мам, это конец, я не выиграю конкурс. Я так старался, делал кораблик и так глупо его потерял. — голос Тима дрогнул.</p><p class="p1">Маме стало жаль сына. Она задумалась, обняла мышонка и сказала: "А что, если мы сейчас всё приберём? Тогда уж поделка точно отыщется. Верно? "</p><p class="p1">— Мама, ну как же мы успеем? Ведь до конкурса осталось всего полчаса. — неуверенно, но с надеждой спросил Тим.</p><p class="p1">— Давай разделим, кто и что будет прибирать, так получится гораздо быстрее. Ты собери материалы для творчества в одну большую коробку. Я соберу все игрушки и расставлю их на полках. Позовём папу, он поможет нам с книгами, альбомами и раскрасками. Договорились?</p><p class="p1">— О, это отличная идея. Кажется, это действительно будет гораздо быстрее. — обрадовался Тим.</p><p class="p1">Они позвали папу и принялись за дело. Тим собирал баночки, фантики, листики, палочки и прочие материалы и аккуратно складывал их в большую коробку. А мама собрала все-все игрушки и расставила их на полках. Машинки с машинками, плюшевые звери с плюшевыми зверями, мячики рядом с мячиками, все заняли свои места. Папа аккуратно расставил книги и сложил альбомы с раскрасками в подставки. Они все вместе оглядели чистую, прибранную комнату.</p><p class="p1">Тим осмотрел все полочки и шкафы, везде был порядок. Красота! Вдруг он заметил синий бок кораблика. Он торчал из-под стола.</p><p class="p1">— Мам, пап, он нашёлся, спасибо! Ведь вчера, когда я с ним играл, было "Ко-ра-бле-кру-ше-ни-е!" и он «пошёл ко дну», я совсем про это забыл. Тим достал кораблик из-под стола и с сияющей улыбкой направился к выходу. У него оставалось ещё пять минут, как раз, чтобы оказаться на полянке до начала конкурса. Он побежал изо всех сил, крепко держа Кораблик в лапках.</p><p class="p1">На конкурсе у всех зверят были замечательные поделки, но поделка Тима понравилось жюри больше всех, и он занял первое место. Ему вручили грамоту, вкусную конфету и медаль. Родители тоже пришли на конкурс, поддержать своего любимого сыночка. Они обняли Тима и поздравили с победой. Родители разрешили Тиму пригласить всех зверят, участвовавших в конкурсе, к себе в гости. Дети весело провели время они пили чай с малиновым пирогом, а потом играли в чистой и опрятной комнате.</p><p class="p1">Тим понял, что если все вещи лежат на своих местах, то их очень просто найти. А ещё, что нужно хранить только необходимые вещи, а лишние лучше не заводить. Ведь среди огромного количества предметов, очень сложно отыскать, то, что действительно важно.</p><p class="p1">Поэтому, на следующий день, он решил, что лишние, хорошие игрушки он подарит детям, у которых их очень мало или вовсе нет. А сломанные игрушки, Тим вместе с папой починил и принес на полянку, на которой гуляли все зверята. Мышонок с друзьями начали с удовольствием играть, с игрушками получившим вторую жизнь.</p><p class="p1">Тим и его родители прощаются с вами и желают, чтобы ваша комната сияла чистотой, и вы всегда знали, где найти, то, что вам сейчас необходимо.</p><p class="p1">А если вы хотите узнать о приключениях других зверят зелёного-зелёного леса, то поскорее открывайте книжку с новыми "Лисьими сказками".</p></span>
