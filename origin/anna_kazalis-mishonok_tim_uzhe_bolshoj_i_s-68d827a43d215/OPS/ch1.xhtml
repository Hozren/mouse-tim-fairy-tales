<div class="title">
<p class="p">Анна Казалис</p>
<p class="p">Мышонок Тим уже большой и самостоятельный</p>
</div>
<span><div class="image">
<img class="z1" alt="" src="images/i_001.jpg"/>
</div><p class="empty-line"/><p class="p1">Художник Марко Кампанелла</p><p class="p1">Пересказ Надежды Конча</p><p class="empty-line"/><p class="p1">Topo Tip non vuole diventare grande</p><p class="p1">from an idea by <div class="image">
<img class="z1" alt="" src="images/i_003.jpg"/>
</div> Andrea Dami</p><p class="p1">Copyright © 2024 Giunti Editore S.p.A., Firenze-Milano</p><p class="p1">www.giunti.it</p><p class="p1">© ООО «РОСМЭН», 2024</p></span>
<span><p class="subtitle">* * *</p><p class="p1">Какой беспорядок в комнате у мышонка Тима! На полу разбросаны игрушки, бумажки, карандаши – чего тут только нет!</p><p class="p1">А где же сам Тим? Может, он играет? Нет, Тим решил узнать, насколько он подрос за последний месяц. Он уже давно мечтает поскорее вырасти. Он взял в лапки карандаш и отмерил свой рост.</p><p class="p1">– Смотри, мишка! – говорит Тим своему любимому плюшевому медвежонку. – Я уже почти взрослый!</p><p class="p1">Медвежонок промолчал в ответ – он очень рад за своего друга, но разговаривать не умеет.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_004.jpg"/>
</div><p class="empty-line"/><p class="p1">Тут в комнату вошла мама. В лапах у неё ведро с водой и щётка.</p><p class="p1">– Ох, Тим, – качая головой, говорит мама. – Ну и беспорядок! Здесь надо убраться!</p><p class="p1">Мышонок Тим хмурится: он считает, что всё, что ему нужно, лежит на своих местах. Но маму не переубедишь.</p><p class="p1">– Тим, пора тебе научиться убирать за собой, ты ведь уже такой большой, – говорит мама и протягивает Тиму пустую коробку. – Убери сюда игрушки, которые тебе не нужны. А я пока разберу твои вещи в шкафу.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_005.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим не любит отдавать свои игрушки. Но мама права: с некоторыми игрушками давно пора расстаться. Мама отнесёт их на чердак, и они достанутся его младшей сестрёнке, когда она ещё чуть-чуть подрастёт.</p><p class="p1">«Уф! Сколько же у меня ненужных игрушек!» – думает Тим, складывая их в коробку.</p><p class="p1">– Знаешь, Тим, – говорит мама, развешивая одежду сына, – давай мы отдадим вещи, из которых ты вырос и которые тебе не нравятся.</p><p class="p1">Мышонок Тим согласен. Так можно и от лишних вещей избавиться, и помочь кому-то.</p><p class="p1">– Ну вот, – с улыбкой говорит мама, – теперь тебе будет легче отыскать любимые футболки.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_006.jpg"/>
</div><p class="empty-line"/><p class="p1">В комнате у Тима порядок. Самое время искупаться. Мышонок Тим надевает халатик и плетётся в ванную.</p><p class="p1">А мама уже там:</p><p class="p1">– Сегодня, Тим, ты будешь мыться в настоящей, большой ванне – ты ведь уже почти взрослый! Ты доволен?</p><p class="p1">Да, мышонок Тим доволен, но… Ему страшновато. Ванна такая большая, а он такой маленький. Он там просто потеряется. Тим привык мыться в маленькой детской ванночке. Хотя, честно говоря, он уже давно из неё вырос.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_007.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим задумчиво посмотрел на ванну. Нет, не будет он тут купаться! Слишком глубоко!</p><p class="p1">Тим развернулся и помчался к себе в комнату. Сел в углу, скрестил лапки на груди и закутался в халатик.</p><p class="p1">– Знаешь, мишка, – говорит он своему плюшевому медвежонку, – я, наверное, больше не хочу быть взрослым. И во взрослой ванне мыться не хочу! Лучше я останусь маленьким.</p><p class="p1">Конечно же Тим знает, что все рано или поздно вырастают. Но он пока не готов к новому.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_008.jpg"/>
</div><p class="empty-line"/><p class="p1">В комнату вошла мама. Она села рядом с сыном и погладила его по голове.</p><p class="p1">– Что случилось, Тим? – спрашивает мама. – Ты испугался ванны?</p><p class="p1">Тим кивает:</p><p class="p1">– Она – такая большая, а я – такой маленький…</p><p class="p1">– Не переживай, – успокаивает его мама. – В этой ванне будет ещё веселее купаться, чем в маленькой ванночке. Вот увидишь! Она просто кажется тебе большой. Хотя и сам ты сильно подрос.</p><p class="p1">Да, Тим знает, что подрос. И даже втайне гордится этим. Что ж, значит, пора мыться в настоящей взрослой ванне.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_009.jpg"/>
</div><p class="empty-line"/><p class="p1">Мама с Тимом возвращаются в ванную. А вот и папа. Ой, а почему он тоже в халате?</p><p class="p1">Мама набирает воду, проверяет лапкой. Водичка отличная, не слишком холодная, но и не слишком горячая. А сколько в ванне пены! Огромные пушистые облака!</p><p class="p1">– Ну что, будешь купаться? – спрашивает мама.</p><p class="p1">Но Тиму всё ещё немножко страшно. Он неуверенно подходит к ванне. И тут…</p><p class="p1">– Слушай, Тим, – вдруг говорит папа, – а давай искупаемся вместе? Ванна не будет казаться такой большой, если мы залезем в неё вдвоём!</p><p class="p1">Отличная идея! Тим радостно плюхается в воду, а за ним и папа. Бултых!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_010.jpg"/>
</div><p class="empty-line"/><p class="p1">Мышонок Тим весело плещется вместе с папой. Тим ныряет, брызгается и хохочет. Ему больше не страшно. Как же здо́рово купаться в настоящей, большой ванне! А ещё мама купила новое мыло – оно так вкусно пахнет!</p><p class="p1">Жаль только, что нельзя взять с собой любимого мишку. Он же плюшевый, а значит, быстро промокнет, если окунуть его в воду, и будет потом сохнуть долго-предолго. И Тиму придётся ложиться спать без него. Нет, так Тим не хочет. Поэтому он оставил своего медвежонка на табуретке. Теперь мишка будет рядом, но не намокнет. Красота!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_011.jpg"/>
</div><p class="empty-line"/><p class="p1">Пора мыть голову. Мышонок Тим этого не любит: шампунь щиплет глазки. Но сегодня… сегодня он будет мыть голову папе! А папа – ему. От этого ещё веселее. В воздух летят клочья пены.</p><p class="p1">– Гляди, какая у тебя пушистая белая шляпа! – кричит Тим.</p><p class="p1">Папа смеётся и говорит:</p><p class="p1">– Ага. А теперь давай её смоем. Держи душ!</p><p class="p1">Тим направляет душ прямо папе в мордочку и включает воду на полную. И-и-и! Вода льётся на папу, в ванну, на пол. Даже медвежонку досталось!</p><p class="p1">– Супер! – кричит довольный Тим.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_012.jpg"/>
</div><p class="empty-line"/><p class="p1">И чего он так боялся? Оказывается, купаться, как взрослые, – это классно! В детской ванночке не особо повеселишься.</p><p class="p1">– Зажми нос и закрой глазки! – командует папа, взяв у Тима душ. – Сейчас я тебя окачу!</p><p class="p1">Он направляет душ на Тима. А тот хихикает – пена щекочет ему нос и ушки. Вуш-ш-ш! Вода потоками стекает с Тима, унося с собой пену. Как здо́рово!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_013.jpg"/>
</div><p class="empty-line"/><p class="p1">Теперь Тим совсем чистый и его шёрстка так приятно пахнет!</p><p class="p1">Ну вот, пора вылезать из ванны.</p><p class="p1">– Так быстро? – ворчит мышонок Тим, надевая халатик. – А в следующий раз ты тоже будешь со мной купаться, да, папа?</p><p class="p1">Набросив халат, папа гладит Тима по голове:</p><p class="p1">– Не переживай, мы ещё не раз с тобой искупаемся. Но ты должен научиться мыться и один, без меня. Ты же справишься, правда?</p><p class="p1">Тим кивает – он больше не боится купаться во взрослой ванне.</p><p class="p1">– Ой-ой-ой, – задумчиво говорит папа, почесав в затылке. – Гляди, что мы с тобой тут устроили! На полу целые лужи воды! Давай-ка быстро всё уберём!</p><p class="p1">И Тим с удовольствием бросается помогать папе, ведь он уже совсем взрослый!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_014.jpg"/>
</div><p class="empty-line"/><p class="p1">Пока Тим с папой мылись, мама приготовила вкусный ужин. Перекусив, мышонок Тим надевает пижамку и ложится в постель. Мама приходит пожелать ему спокойной ночи.</p><p class="p1">– Я очень тобой горжусь, сынок, – говорит она. – Ты сумел преодолеть страх, а это всегда непросто.</p><p class="p1">Тим широко улыбается. Да он и сам не ожидал, что так получится. Он так боялся большой, глубокой ванны, а оказалось, что мыться в ней очень даже весело.</p><p class="p1">– Мамочка, – подумав немного, говорит мышонок Тим, – а взрослые могут обниматься?</p><p class="p1">Мама смеётся.</p><p class="p1">– Конечно! – говорит она и крепко обнимает Тима. – И помни: даже когда ты станешь совсем-совсем взрослым, для нас с папой ты всегда останешься нашим любимым сыночком!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_015.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_001.jpg"/>
</div></span>
