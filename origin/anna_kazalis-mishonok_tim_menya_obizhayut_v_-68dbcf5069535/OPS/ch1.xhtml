<div class="title">
<p class="p">Анна Казалис</p>
<p class="p">Мышонок Тим. Меня обижают в детском саду!</p>
</div>
<span><div class="image">
<img class="z1" alt="" src="images/i_002.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_003.jpg"/>
</div><p class="empty-line"/><p class="p1">Topo Tip. Aiuto ci sono i bulli!</p><p class="p1">From an idea by <div class="image">
<img class="z1" alt="" src="images/i_004.png"/>
</div> Andrea Dami</p><p class="p1">Illustrations by Marco Campanella</p><p class="p1">Texts by Anna Casalis</p><p class="p1">Graphic design by Stefania Pavin</p><p class="p1">© 2021 Giunti Editore S.p.A., Milano-Firenze Dami International, a brand of Giunti Publishing Group www.giunti.it</p><p class="p1">© ООО «РОСМЭН», 2021</p></span>
<span><p class="subtitle">* * *</p><p class="p1">Наступила осень. Мышонку Тиму снова пора в детский сад. Тим очень рад. В этом году он пойдёт в новую группу. У него будет новая воспитательница и, конечно, появятся новые друзья!</p><p class="p1">Тим с радостью собирает свой рюкзачок. Он положил туда носовой платочек, зубную щётку…</p><p class="p1">А ещё мама дала ему пончик.</p><p class="p1">– Спасибо, мамочка! – обрадовался Тим.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_005.jpg"/>
</div><p class="empty-line"/><p class="p1">В новой группе дети немного старше Тима. Они болтают и громко смеются. Мышонок даже не всё понимает, о чём они говорят. Тим думает, что они очень умные. И вообще классные.</p><p class="p1">А какие у этих ребят бейсболки! Тим тоже хочет такую. Но ещё больше ему хочется, чтобы старшие ребята с ним подружились.</p><p class="p1">– Здравствуйте! – робко говорит Тим. – Давайте играть в мяч.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_006.jpg"/>
</div><p class="empty-line"/><p class="p1">– Ха-ха-ха! – смеются большие ребята.</p><p class="p1">– Ты думаешь, мы будем с тобой играть?</p><p class="p1">– А бейсболка у тебя есть? Мы играем только с теми, у кого есть вот такие классные бейсболки, как у нас.</p><p class="p1">– Уходи, малявка! Беги возись с малышами.</p><p class="p1">Тиму очень обидно!</p><p class="p1">Ну почему они с ним так? Почему не хотят даже с ним играть?</p><p class="p1">– Я не малявка! Я уже большой! – кричит он. – Поч-ти такой же большой, как вы!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_007.jpg"/>
</div><p class="empty-line"/><p class="p1">Все садятся обедать. И тут – ура! – большие ребята наконец позвали Тима:</p><p class="p1">– Эй ты, иди сюда! Покажи, что тебе дали с собой. Пончик? Здорово!</p><p class="p1">Тим с гордостью показывает, что ему дала мама.</p><p class="p1">И тут самый крупный из ребят схватил пончик и подбросил его к потолку.</p><p class="p1">– Отдай, это моё! – пискнул Тим. Но тот только оттолкнул Тима, поймал пончик и откусил.</p><p class="p1">– Мм… вкуснятина!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_008.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим сидит один в уголке. Ему очень обидно.</p><p class="p1">– Не расстраивайся, Тим! Не обращай на них внимания! – говорит Джоли, самая добрая девочка в группе. – Они просто глупые! Меня тоже обижают – вон те девочки с розовыми бантиками. Они так хвастаются своими бантиками – ужас!</p><p class="p1">– Ты не понимаешь: я хочу быть большим и сильным! – кричит Тим. – И чтобы они поняли, что я большой и сильный!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_009.jpg"/>
</div><p class="empty-line"/><p class="p1">Весь день у мышонка Тима плохое настроение.</p><p class="p1">Он на всех сердится. Ему кажется, что никто его не любит и не понимает. От злости Тим портит сестрёнкину игрушку.</p><p class="p1">– Тим! Что ты делаешь?! – Мама очень сильно разозлилась, а сестрёнка Тима горько плачет. – Всё, ты наказан!</p><p class="p1">– Ну и пожалуйста, – ворчит Тим.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_010.jpg"/>
</div><p class="empty-line"/><p class="p1">А на следующий день в детском саду старшие ребята забрали у Тима его плюшевого мишку и изрисовали фломастерами.</p><p class="p1">– Ха-ха-ха! Это мишка-монстр! – хохочут они. – Забирай своего монстра и иди играй с малышами.</p><p class="p1">Тим чуть не плачет. Он не знает, как за себя постоять. Он-то считал себя взрослым и смелым мышонком, но сейчас чувствует себя маленьким и беззащитным.</p><p class="p1">Если бы воспитательница видела, что произошло, этим безобразникам было бы не до смеха. Но она не видела, а Тим молчит.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_011.jpg"/>
</div><p class="empty-line"/><p class="p1">Вечером Тим вспомнил все обиды и расплакался.</p><p class="p1">– Мама, я не хочу в детский сад! Там все плохие!</p><p class="p1">И Тим наконец рассказал, как его обижают.</p><p class="p1">– Ну подумай сам, Тим, плохие-то не все, а только эти ребята. Держись от них подальше, – говорит мама, отстирывая любимого мишку Тима. – А я завтра поговорю с воспитательницей. Вот увидишь, она обязательно что-нибудь придумает. Нельзя обижать младших. Это очень плохо. Запомни, Тим.</p><p class="p1">Теперь Тиму уже не так грустно.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_012.jpg"/>
</div><p class="empty-line"/><p class="p1">На другой день Тим смело шагает в детский сад.</p><p class="p1">И вдруг он заходит в группу и видит, как старшие ребята обижают самого маленького – Топси.</p><p class="p1">– А ну-ка, прекратите! – кричит Тим и встаёт перед Топси. – Иначе я вам всем покажу!</p><p class="p1">Топси вцепился в Тима. Он очень рад, что тот за него заступился.</p><p class="p1">А большие ребята ужасно удивились.</p><p class="p1">«Надо же! – думают они. – А этот Тим сильный и смелый. Надо его взять в нашу компанию».</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_013.jpg"/>
</div><p class="empty-line"/><p class="p1">Но мышонок Тим уже понял, что такие друзья ему не нужны!</p><p class="p1">Добрая Джоли, маленький Топси и Тим взялись за лапки и пошли прочь от хулиганов.</p><p class="p1">– Ты ещё пожалеешь! Ты даже не представляешь, что мы придумали! Это будет самое классное развлечение! – зазывают его большие ребята.</p><p class="p1">– Развлекайтесь без меня, – твёрдо говорит Тим. – У вас свои дела, а у меня – свои.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_014.jpg"/>
</div><p class="empty-line"/><p class="p1">И вот какое развлечение придумали большие ребята.</p><p class="p1">Пока все были на прогулке, они устроили настоящий тарарам в столовой.</p><p class="p1">– Ха-ха-ха! – И они вылили молоко на пол.</p><p class="p1">– Хей-хей! – Стали скакать по столам.</p><p class="p1">– Хо-хо! Мы самые старшие и никого не боимся!</p><p class="p1">Они думают: «Сейчас малыши придут завтракать и сразу поймут, какие мы взрослые и классные!»</p><p class="p1">Но они ошиблись. Никто ими не восхищался, а воспитательница страшно рассердилась.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_015.jpg"/>
</div><p class="empty-line"/><p class="p1">– Сейчас же берите тряпки и убирайте за собой! – сказала она. – А уж если я увижу, что вы задираете малышей…</p><p class="p1">Вот так хулиганы сами себя наказали. И пока Тим играл с друзьями, они наводили порядок в столовой.</p><p class="p1">Как видишь, Тим – молодец! Он всем доказал, что он большой и сильный, ведь быть большим – это значит защищать малышей и поступать правильно.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_016.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_017.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_018.jpg"/>
</div><p class="empty-line"/><div class="image">

</div></span>
