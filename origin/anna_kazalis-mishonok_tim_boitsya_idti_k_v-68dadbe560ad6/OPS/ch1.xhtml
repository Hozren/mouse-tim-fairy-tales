<div class="title">
<p class="p">Анна Казалис</p>
<p class="p">Мышонок Тим боится идти к врачу</p>
</div>
<span><div class="image">
<img class="z1" alt="" src="images/i_002.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_003.jpg"/>
</div><p class="empty-line"/><p class="p1">Topo Tip. Ahi, mi sono fatto male!</p><p class="p1">From an idea by <div class="image">
<img class="z1" alt="" src="images/i_004.png"/>
</div> Andrea Dami</p><p class="p1">Illustrations by Marco Campanella</p><p class="p1">Texts by Anna Casalis</p><p class="p1">Graphic design by Stefania Pavin</p><p class="p1">© 2021 Giunti Editore S.p.A., Milano-Firenze Dami International, a brand of Giunti Publishing Group www.giunti.it</p><p class="p1">© ООО «РОСМЭН», 2021</p></span>
<span><p class="subtitle">* * *</p><p class="p1">Папа мышонка Тима едет в деревню. Дедушка заболел, и папа хочет помочь бабушке за ним ухаживать. Малышку Лили папа берёт с собой. Она недавно болела – ей полезно подышать свежим воздухом.</p><p class="p1">Лили машет из окна машины.</p><p class="p1">– Пока-пока! – кричит Тим. – Передавай привет бабушке с дедушкой!</p><p class="p1">Мышонок Тим доволен: он весь день проведёт с мамой.</p><p class="p1">– Мы пойдём в парк, да? – спрашивает у мамы мышонок Тим.</p><p class="p1">– Если хочешь. Сегодня ты выбираешь, куда пойти.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_005.jpg"/>
</div><p class="empty-line"/><p class="p1">Мышонок Тим сложил свои любимые игрушки в тележку, и они с мамой отправились в парк.</p><p class="p1">Тим представляет, как встретит там друзей и во что они будут играть.</p><p class="p1">Но парк довольно далеко, и Тим устал, хотя тележку везёт мама, а не он.</p><p class="p1">– Долго ещё? – ноет Тим. – У меня вообще нет сил!</p><p class="p1">– Не очень. Не переживай: сейчас увидишь друзей, и силы тут же появятся.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_006.jpg"/>
</div><p class="empty-line"/><p class="p1">И в самом деле, как только они дошли до парка, оказалось, что Тим совсем не устал.</p><p class="p1">– Фипси! Диди! Привет! – радостно закричал Тим и бросился к друзьям.</p><p class="p1">В парке здорово. Тут и качели, и лазалки, и высокая-высокая горка.</p><p class="p1">Тиму хочется показать друзьям, какой он ловкий и смелый.</p><p class="p1">– Я сейчас залезу на самый верх, а потом на качели, а потом скачусь с горки – быстрее ветра!</p><p class="p1">– Тим, я тут рядом, вместе с другими мамами. Лазай осторожно! – предупреждает мама.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_007.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим махнул маме и быстро-быстро полез наверх. Фипси и Диди удивляются: ничего себе, как быстро он карабкается!</p><p class="p1">А мышонок Тим так стремительно перебирает лапками, что даже в них не путается.</p><p class="p1">– Осторожнее, Тим! – просит Фипси. – А то упадёшь.</p><p class="p1">– Не упаду! – смеётся Тим. – Я залезу на самый верх и покажу своему мишке, какой оттуда вид!</p><p class="p1">– Держись крепче, Тим, – советует Диди. – Всё-таки ты забрался очень высоко.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_008.jpg"/>
</div><p class="empty-line"/><p class="p1">Но мышонок Тим их не слушает. Он торопится залезть на самый верх.</p><p class="p1">Вдруг… лапка у него соскользнула и…</p><p class="p1">– А-а-а-а! – Тим упал. – У-у-у, как больно! – плачет Тим, схватившись за лапку. – Я сломал лапу!</p><p class="p1">Диди кинулся к нему.</p><p class="p1">– Потерпи, сейчас Фипси приведёт твою маму, – говорит Диди и, чтобы утешить Тима, добавляет: – Ты карабкался очень быстро… а вниз летел ещё быстрее!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_009.jpg"/>
</div><p class="empty-line"/><p class="p1">А вот и мама!</p><p class="p1">– Здесь больно? – спрашивает она, ощупывая лапку Тима.</p><p class="p1">– Да, мамочка! Очень!</p><p class="p1">– Нам надо в больницу, – говорит мама.</p><p class="p1">– Нет-нет! – плачет мышонок Тим. – Я боюсь! Смотри, мне уже лучше, уже почти прошло.</p><p class="p1">Мышонок Тим встаёт, но идти не может.</p><p class="p1">Хорошо, что они взяли с собой тележку. Теперь в ней сидит Тим, а мама его везёт.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_010.jpg"/>
</div><p class="empty-line"/><p class="p1">Ехать в тележке весело, но больница пугает Тима.</p><p class="p1">На входе их встречает добрая медсестра.</p><p class="p1">– Привет, малыш. Что у тебя с лапкой? – спрашивает она.</p><p class="p1">– Ничего, всё в порядке, – бормочет Тим.</p><p class="p1">Но мама рассказала медсестре, в чём дело.</p><p class="p1">– Сейчас врач его осмотрит. Не переживай, малыш, у нас очень хорошие врачи.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_011.jpg"/>
</div><p class="empty-line"/><p class="p1">Но сначала надо подождать своей очереди. Мама отвела Тима в игровую комнату к другим детям.</p><p class="p1">– Почему у тебя рука перевязана? Это врачи тебя поранили? – спросил Тим у одного малыша.</p><p class="p1">– Нет, поранился я сам. А врачи мне сделали гипс, и теперь рука почти не болит. Я даже могу играть. Смотри, какой самолёт!</p><p class="p1">– А я ударилась головой, и у меня во-о-от такущая шишка! – пожаловалась незнакомая девочка. – Но врач помазал её мазью, и теперь почти совсем не болит.</p><p class="p1">Мышонок Тим немного успокоился.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_012.jpg"/>
</div><p class="empty-line"/><p class="p1">– Тим, иди скорее, – зовёт медсестра.</p><p class="p1">Доктор уже ждёт его. Он в белом халате и не кажется злым.</p><p class="p1">«Может, он и не будет делать мне больно», – рассуждает Тим.</p><p class="p1">– Садись, Тим, и расскажи мне, что с тобой приключилось.</p><p class="p1">Тим с удовольствием рассказывает, как хотел залезть повыше и упал. Он любит болтать.</p><p class="p1">– Я залез на самый верх! Быстрее всех! И упал… а там было метров десять!</p><p class="p1">Преувеличивать Тим тоже любит.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_013.jpg"/>
</div><p class="empty-line"/><p class="p1">– Ну, в таком случае тебе очень повезло, что ты ничего не сломал, – говорит доктор и посмеивается, прощупывая лапку Тима. – Небольшой вывих, ничего страшного. Сейчас перевяжем, и быстро пройдёт.</p><p class="p1">Доктор делает всё очень осторожно. Тим даже доволен.</p><p class="p1">– Мама, смотри! У меня лапка перевязана, как у настоящего бойца! А мой медвежонок упал с высоты вместо со мной! Вы можете сделать повязку и ему тоже?</p><p class="p1">Доктор улыбается и аккуратно перевязывает мишкину лапу.</p><p class="p1">– Спасибо вам большое! – Тим берёт мишку и говорит ему: – Видишь, в больнице совсем не страшно!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_014.jpg"/>
</div><p class="empty-line"/><p class="p1">Дома, за ужином, Тим взахлёб рассказывает папе обо всём, что с ним случилось, и с гордостью показывает свою перевязанную лапку.</p><p class="p1">– В парке было здорово! – рассказывает Тим. – Я залез ужасно высоко, а в следующий раз залезу ещё выше! Ты увидишь, папа, как я высоко могу залезть! Только мишку я тебе оставлю, чтобы я мог держаться всеми лапками. И падать я больше не буду. Но, если вдруг всё-таки случайно упаду, я пойду к доктору, и он меня вылечит!</p><p class="p1">– И всё-таки будь поосторожнее, Тим, – просит его папа. – А то можно так упасть, что и доктор не поможет. И ты прав, мишку надо беречь. Вон у него тоже теперь лапка перевязана.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_015.jpg"/>
</div><p class="empty-line"/><p class="p1">– Завтра я пойду в детский сад и всем расскажу, что со мной было, – говорит Тим, когда папа укладывает его спать.</p><p class="p1">– Нет, дружок. Доктор сказал, что тебе надо пару дней посидеть дома.</p><p class="p1">– Но как же так? Неужели никто не увидит мою перевязанную лапку?</p><p class="p1">– Ну почему же, – смеется папа. – Ты можешь пригласить друзей к себе. Главное, чтобы на этот раз они не стали брать с тебя пример.</p><p class="p1">– Хорошо, я им так и скажу.</p><p class="p1">Тим улыбается и засыпает. Лапка у него больше не болит.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_016.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_017.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_018.jpg"/>
</div></span>
