<div class="title">
<p class="p">Анна Казалис</p>
<p class="p">Мышонок Тим не хочет делиться</p>
</div>
<span><div class="image">
<img class="z1" alt="" src="images/i_002.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_003.jpg"/>
</div><p class="empty-line"/><p class="p1">Topo Tip. Questo è mio e ci gioco io!</p><p class="p1">Copyright © 2021 Giunti Editore S.p.A., Milano-Firenze</p><p class="p1">Dami International, a brand of Giunti Publishing Group</p><p class="p1">www.giunti.it</p><p class="p1">© ООО «РОСМЭН», 2021</p></span>
<span><p class="subtitle">* * *</p><p class="p1">Смотри, какой чудесный замок из песка построил мышонок Тим! У него во дворе большая песочница. Тим часто приходит туда с лопаткой и ведёрком. Он любит строить дороги для игрушечных машинок, делать домики и даже целые замки. Но сегодня замок у него получился особенно хороший! С башенками, с окошками и с флагом!</p><p class="p1">– Красота! – радуется Тим. – Осталось сделать дорогу к замку.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_004.jpg"/>
</div><p class="empty-line"/><p class="p1">Тут к Тиму подходит мама. С ней Лили – младшая сестрёнка Тима.</p><p class="p1">– Какой замечательный замок! – восхищается мама.</p><p class="p1">Лили берёт лопатку. Она тоже хочет играть в песке.</p><p class="p1">– Отдай! Она моя! – тут же кричит Тим.</p><p class="p1">– Твоя, твоя, – говорит мама. – Но ты же добрый мышонок и дашь Лили немножко поиграть с твоей лопаткой.</p><p class="p1">– НЕ ДАМ! МОЯ ЛОПАТКА! – вопит Тим. Он хватается за лопатку, которую держит Лили и тянет, тянет…</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_005.jpg"/>
</div><p class="empty-line"/><p class="p1">Шлёп! Тим выпустил лопатку – и Лили отлетела прямо на замок. Лили не ушиблась, но замок… Ох, от него ничего не осталось.</p><p class="p1">– А-а-а-а-а! – Тим даже заплакал от обиды.</p><p class="p1">Лили тоже плачет.</p><p class="p1">А мама рассердилась.</p><p class="p1">– Видишь, Тим, что бывает, когда жадничаешь! Тебе же хуже выходит!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_006.jpg"/>
</div><p class="empty-line"/><p class="p1">На другой день Тим пошёл в детский сад.</p><p class="p1">Все дети играют вместе, а Тим – один. Он набрал все свои любимые игрушки и никому их не даёт.</p><p class="p1">Одному играть не очень интересно, но и делиться Тиму не хочется.</p><p class="p1">– Игрушки мои! – бурчит Тим себе под нос.</p><p class="p1">Вообще-то это неправда. В детском саду игрушки – общие. Все дети могут с ними играть.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_007.jpg"/>
</div><p class="empty-line"/><p class="p1">А уж дома к своим собственным игрушкам Тим никому не разрешает прикасаться! Сестрёнка с завистью смотрит на кубики и самолётик. Она бы хотела с ними поиграть, но даже спрашивать боится.</p><p class="p1">Сегодня Тим идет в гости к Бенни. Он собрал свои игрушки в рюкзак.</p><p class="p1">«Надеюсь, Бенни не будет их выпрашивать, – беспокоится Тим. Делиться он не собирается. Просто боится оставить игрушки дома. – Лили наверняка их возьмёт, пока меня не будет!» – думает Тим.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_008.jpg"/>
</div><p class="empty-line"/><p class="p1">– Хочешь, поиграем с поездом? – предлагает Бенни.</p><p class="p1">У него большая железная дорога, по которой ездят два поезда.</p><p class="p1">Мышонок Тим поражён. Ничего себе! Бенни предлагает ему играть с такой замечательной железной дорогой. Да ещё отдал Тиму самый хороший поезд, который ему только-только подарили на день рождения. А себе взял старый.</p><p class="p1">«Если бы у меня была такая железная дорога, я бы никому не позволил с ней играть», – думает мышонок.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_009.jpg"/>
</div><p class="empty-line"/><p class="p1">Мама Бенни принесла малышам по кусочку торта. Она сама его испекла, и какой это вкусный торт! Тим мигом проглотил свой кусочек.</p><p class="p1">– Хочешь, я отдам тебе свой? – спрашивает Бенни.</p><p class="p1">Мышонок Тим отказаться не может. Он тут же съедает и второй кусок. А сам думает: «Бенни странный. Я бы свой кусок не отдал».</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_010.jpg"/>
</div><p class="empty-line"/><p class="p1">Вот и вечер. Мышонку Тиму пора домой. Он собирает свои игрушки в рюкзак и вдруг видит жёлтенький экскаватор.</p><p class="p1">– Хороший! – думает Тим. – А у меня такого нет!</p><p class="p1">Мышонок Тим и сам не понимает, как так вышло, но он сунул экскаватор в рюкзак.</p><p class="p1">Представляешь? Украл игрушку у своего друга!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_011.jpg"/>
</div><p class="empty-line"/><p class="p1">Конечно же, мама сразу заметила у Тима чужую игрушку. И очень-очень сильно разозлилась.</p><p class="p1">– Ну представь, каково бы тебе было, если бы кто-то забрал твои игрушки? Ты поступил очень плохо!</p><p class="p1">Тим и сам это понимает. Ему ужасно стыдно. А уж когда он вспоминает, как Бенни с ним всем делился – и с железной дорогой дал поиграть, и свой кусочек торта отдал… тут Тиму становится так горько, что хочется зажмуриться и исчезнуть.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_012.jpg"/>
</div><p class="empty-line"/><p class="p1">– Я верну, – бормочет Тим. – Завтра же…</p><p class="p1">– Нет, Тим, лучше прямо сейчас, – говорит мама.</p><p class="p1">Мышонок Тим идёт к Бенни. Он знает, что надо отдать экскаватор и извиниться, всю дорогу он повторяет слова. Сказать их очень трудно.</p><p class="p1">Вот и дом Бенни. Тим протягивает друг жёлтенький экскаватор. Ему хочется сквозь землю провалиться.</p><p class="p1">Бенни улыбается от уха до уха.</p><p class="p1">– Как здорово, что ты его принёс! А я как раз думал, куда же он пропал!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_013.jpg"/>
</div><p class="empty-line"/><p class="p1">– Это я, – признаётся Тим. – Я его взял, он мне очень понравился… Но я больше никогда-никогда не буду брать чужое! Прости меня, Бенни.</p><p class="p1">Тим чуть не плачет. Наверняка Бенни больше не захочет с ним дружить.</p><p class="p1">– Знаешь, Тим, – говорит Бенни, – раз он тебе так нравится, давай играть с ним по очереди – несколько дней ты, несколько дней я. Или, хочешь, давай всеми игрушками делиться. Тогда получится, как будто у нас игрушек много-много. Давай?</p><p class="p1">– Давай, – говорит мышонок Тим.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_014.jpg"/>
</div><p class="empty-line"/><p class="p1">Теперь в детском саду Тим больше не сидит один с игрушками – он играет вместе со всеми.</p><p class="p1">Он понял, как здорово делиться. И друзей у него теперь много!</p><p class="p1">И даже сестрёнке он даёт поиграть с самолётиком, хотя всё равно немного беспокоится: вдруг сломает, всё-таки она ещё маленькая.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_015.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_016.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_017.jpg"/>
</div></span>
