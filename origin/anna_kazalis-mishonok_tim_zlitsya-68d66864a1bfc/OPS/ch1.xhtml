<div class="title">
<p class="p">Анна Казалис</p>
<p class="p">Мышонок Тим злится</p>
</div>
<span><div class="image">
<img class="z1" alt="" src="images/i_002.jpg"/>
</div><p class="empty-line"/><p class="p1">Художник Катерина Джорджетти</p><p class="p1">Пересказ Марии Мельниченко</p><p class="empty-line"/><p class="p1">Topo Tip. Grrr, che rabbia!</p><p class="p1">from an idea by <div class="image">
<img class="z1" alt="" src="images/i_003.png"/>
</div> Andrea Dami</p><p class="p1">Copyright © 2023 Giunti Editore S.p.A., Firenze-Milano</p><p class="p1">Dami International, a brand of Giunti Publishing Group</p><p class="p1">www.giunti.it</p><p class="p1">© ООО «РОСМЭН», 2023</p></span>
<span><p class="subtitle">* * *</p><p class="p1">Всё было плохо с самого утра. Мама не дала Тиму досмотреть чудесный сон. А ему снилось, что он выиграл в конкурсе рисунков! И получил приз – ту самую зелёненькую машинку, с которой он любит играть в детском саду. Её отдали насовсем! Но Тим не успел порадоваться – его разбудила мама.</p><p class="p1">– Даже поиграть не смог… – ворчит мышонок себе под нос и вдруг замечает, что сестрёнка Лили разбросала все его игрушки.</p><p class="p1">– Кто разрешил тебе брать мои игрушки?! Ты всё сломаешь! – Тим толкает сестру и бежит жаловаться маме.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_004.jpg"/>
</div><p class="empty-line"/><p class="p1">Лили плачет и тоже бежит на кухню к маме.</p><p class="p1">Мама обнимает дочку и говорит:</p><p class="p1">– Тим, Лили ещё совсем маленькая, не ругай её.</p><p class="p1">Тиму очень обидно: если Лили маленькая, значит, она всегда права, да?</p><p class="p1">Вдобавок на завтрак хлопья.</p><p class="p1">– Я хочу крекеры! – вопит Тим и сердито машет лапой.</p><p class="p1">Дзынь! Его миска опрокинулась, и молоко разлилось по столу.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_005.jpg"/>
</div><p class="empty-line"/><p class="p1">– Тим! – кричит мама. – Хватит капризничать! Быстро доедай и одевайся!</p><p class="p1">В садике тоже всё не так. Тим первым делом бежит к любимой машинке. Но… С ней уже играет Тесса!</p><p class="p1">– Дай сюда! Это моя машинка! – возмущённо кричит Тим, пытаясь выхватить её из лап подруги.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_006.jpg"/>
</div><p class="empty-line"/><p class="p1">– Не-а, не твоя! – кричит в ответ Тесса. – Я тоже хочу с ней поиграть!</p><p class="p1">Тут к ним подходит воспитательница:</p><p class="p1">– Тим, ты же знаешь, что у нас в садике все игрушки общие. Пусть Тесса немного поиграет с машинкой, а ты пока порисуй или поболтай с друзьями.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_007.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим вне себя от злости. Ну почему все против него? Даже воспитательница! Сердито нахмурившись, он отправляется играть с кубиками.</p><p class="p1">– Возьму и построю самую высокую башню на свете! – решает мышонок и ставит один кубик на другой. – Я лучше всех строю башни!</p><p class="p1">– Осторожно! Она сейчас развалится! – предупреждают его друзья.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_008.jpg"/>
</div><p class="empty-line"/><p class="p1">Но Тим никого не слушает – он злится. Вот ещё кубик, и ещё один… Бубух! Башня закачалась и рассыпалась.</p><p class="p1">– Это всё вы виноваты! – сердито кричит Тим друзь-ям. – Вы мне мешали!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_009.jpg"/>
</div><p class="empty-line"/><p class="p1">Эй, Тим, а друзья-то тут при чём?</p><p class="p1">К Тиму подбегает его подруга Фипси. Она добрая и умненькая. Фипси сразу поняла, в чём дело.</p><p class="p1">– Тим, – говорит она, – у тебя просто плохое настроение. Ты злишься, а знаешь, что мне советует мама, когда я злюсь?</p><p class="p1">Мышонок на секунду перестаёт сердиться и удивлённо смотрит на Фипси:</p><p class="p1">– Нет. Расскажи!</p><p class="p1">– Нужно нарисовать что-нибудь противное, страшное и злое. А потом порвать рисунок! И тебе тут же станет легче, – говорит Фипси.</p><p class="p1">– Я нарисую ужасное чудовище, – решает Тим и, схватив карандаши, начинает рисовать.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_010.jpg"/>
</div><p class="empty-line"/><p class="p1">Чудовище вышло и правда ужасное: что-то вроде дракона, призрака и динозавра одновременно! Тим откладывает карандаши и смотрит на свой рисунок. Фипси права – Тим уже не так сердится. Кажется, чудовище гораздо злее него. Тим разрывает листок на мелкие клочки. Вот так! Он может победить всё что угодно, даже свою злость! Мышонок почти успокоился.</p><p class="p1">Но тут к нему подходит воспитательница.</p><p class="p1">– Тим, что ты наделал? – ругает она Тима. – Здесь нельзя мусорить! Быстро убери за собой!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_011.jpg"/>
</div><p class="empty-line"/><p class="p1">Ой-ой-ой! Тима снова захватывает злое чудовище!</p><p class="p1">Дальше становится только хуже. На обед сегодня рис со шпинатом, а Тим так хотел макароны с морковкой! Потом воспитательница рассказывает ребятам сказки. Тим обожает сказки. Но вот беда – эти он уже сто раз слышал! Лучшие друзья мышонка затеяли игру, только вот с Тимом они даже не разговаривают. А воспитательница только и делает, что его ругает!</p><p class="p1">Наступил вечер, за Тимом пришла мама и сразу поняла, что с её любимым мышонком что-то не то.</p><p class="p1">– Что случилось, Тим? – спрашивает она. – Всё в порядке? Может, пройдёмся по магазинам?</p><p class="p1">Этого ещё не хватало!</p><p class="p1">– Нет! – кричит Тим. – Я хочу домой! Меня сегодня никто не любит! Все на меня злятся!</p><p class="p1">Мама всё поняла:</p><p class="p1">– Ладно, Тим. Давай-ка пойдём в парк.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_012.jpg"/>
</div><p class="empty-line"/><p class="p1">Недовольный Тим плетётся за ней: ему сейчас ничего не интересно, даже парк. Но когда они подходят к главному входу, мышонок вдруг замечает продавца воздушных шариков. Они такие большие, такие яркие!</p><p class="p1">– Мамочка, купи мне шарик, пожалуйста! – просит он и опускает голову – сегодня мама наверняка не согласится.</p><p class="p1">Но мама не против:</p><p class="p1">– Хорошо. Выбери себе шарик.</p><p class="p1">– Ура! – кричит Тим. – Я хочу красный!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_013.jpg"/>
</div><p class="empty-line"/><p class="p1">Он радостно хватает шарик и бежит по дорожке.</p><p class="p1">БА-БАХ!</p><p class="p1">Не прошло и пяти минут, как шарик зацепился за ветку и лопнул. В лапе у Тима остались только нитка и клочок красной резины.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_014.jpg"/>
</div><p class="empty-line"/><p class="p1">– НУ ВСЁ! – вопит Тим. – Я БОЛЬШЕ НЕ МОГУ!</p><p class="p1">Он падает на землю и горько плачет. Мама присаживается рядом. Она пытается его поднять и утешить, но мышонок уже не слышит её.</p><p class="p1">– Плохой день, плохой! – в слезах вопит он. – Сегодня всё плохо!</p><p class="p1">Мама обнимает сына, гладит его по голове. Несчастный Тим прижимается к маме, чувствует знакомый и такой уютный запах её духов и потихоньку успокаивается.</p><p class="p1">– Давай сядем на скамейку и поговорим, – предлагает мама. – Я тебе объясню, что произошло.</p><p class="p1">– Да нечего объяснять! – кричит Тим. – Просто сегодня плохой день!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_015.jpg"/>
</div><p class="empty-line"/><p class="p1">– Да, порой кажется, будто весь мир против тебя, – говорит мама. – Но кричать и обвинять других бесполезно. Иногда всё хорошо, всё удаётся, и на душе весело и радостно. Но бывает, что просыпаешься в плохом настроении, и всё идёт не так, как надо. Это не страшно. В такие дни постарайся не обращать внимания на неудачи. Лучше попробуй побороть свою злость и думать о хорошем. Ты ведь у меня такой сильный и смелый!</p><p class="p1">Поздно вечером, засыпая, Тим думает о том, что сказала мама. Да, она права. Бывают плохие дни, и надо просто их пережить.</p><p class="p1">Утром в комнату заглядывает яркое солнышко. Начался новый день, совсем не такой, как вчера! Лили тихо посапывает в своей кроватке. На завтрак Тим радостно уплетает любимую овсянку.</p><p class="p1">В садике к мышонку подбегают друзья и наперебой предлагают поиграть. Только лучший друг Тима Диди почему-то, насупившись, стоит в сторонке.</p><p class="p1">– Иди отсюда! – кричит он, когда Тим к нему подходит. – Я очень злой! Не хочу ни во что играть!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_016.jpg"/>
</div><p class="empty-line"/><p class="p1">«Мама права, – думает мышонок. – Такое может случиться с каждым. Но я знаю, как ему помочь!»</p><p class="p1">Тим зовёт Тессу и Фипси. Они предлагают Диди вместе нарисовать огромное злое чудовище. А потом, если воспитательница разрешит, Диди разорвёт рисунок.</p><p class="p1">На этот раз воспитательница поняла, в чём дело, и согласилась.</p><p class="p1">– А когда разорвёте листок, – сказала она, – попробуйте снова собрать рисунок из клочков. Получится самодельный пазл. Как вам?</p><p class="p1">Друзья радуются – в такое они ещё не играли.</p><p class="p1">Они рисуют чудовище всё утро. Потом Диди разрывает листок, и ребята снова его собирают. Постепенно Диди успокаивается. И вот уже он смеётся вместе с друзьями.</p><p class="p1">– Молодец, Тим! – хвалит воспитательница. – Ты поступил как настоящий друг. Завтра утром можешь сколько хочешь играть с зелёной машинкой!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_017.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_002.jpg"/>
</div></span>
