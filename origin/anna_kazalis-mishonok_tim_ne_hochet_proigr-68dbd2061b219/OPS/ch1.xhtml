<div class="title">
<p class="p">Анна Казалис</p>
<p class="p">Мышонок Тим не хочет проигрывать</p>
</div>
<span><div class="image">
<img class="z1" alt="" src="images/i_002.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_003.jpg"/>
</div><p class="empty-line"/><p class="p1">Topo Tip. Non mi piace perdere!</p><p class="p1">Copyright © 2021 Giunti Editore S.p.A., Milano-Firenze</p><p class="p1">Dami International, a brand of Giunti Publishing Group</p><p class="p1">www.giunti.it</p><p class="p1">© ООО «РОСМЭН», 2022</p></span>
<span><p class="subtitle">* * *</p><p class="p1">Мышонок Тим в детском саду. Вместе с друзьями он играет в настольную игру.</p><p class="p1">Тим бросил кубик, и у него выпало «три».</p><p class="p1">– Раз, два, три! – считает Тим. – Ура-а-а! Хьюго выбывает из игры!</p><p class="p1">Тим хохочет и сбрасывает фишку Хьюго с доски. Хьюго расстроен.</p><p class="p1">– Я почти выиграл, – грустно говорит Хьюго.</p><p class="p1">– «Почти» – не считается! – дразнится Тим. – Я победил!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_004.jpg"/>
</div><p class="empty-line"/><p class="p1">Игра начинается сначала. Но Тиму на этот раз не повезло – он выбыл первым.</p><p class="p1">– Так нечестно! Я хотел выиграть! – кричит Тим. Он скрестил руки на груди и надулся: – Не буду с вами играть!</p><p class="p1">А дело в том, что эта игра для четверых. Без Тима играть не получится. Но мышонку всё равно. Он расстроился и на друзей даже не смотрит.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_005.jpg"/>
</div><p class="empty-line"/><p class="p1">После обеда малыши вышли на улицу.</p><p class="p1">Тим и его лучший друг Диди играют в песочнице. Они строят за́мки из песка, украшают их ракушками и флажками.</p><p class="p1">– Тим, смотри, какой у меня за́мок! – говорит Диди.</p><p class="p1">В самом деле, за́мок у него получился на славу: ровненький, аккуратный, с нарядным флажком.</p><p class="p1">Но Тим не рад за друга. Наоборот он ужасно рассердился:</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_006.jpg"/>
</div><p class="empty-line"/><p class="p1">– Мой, мой за́мок должен быть самым красивым!</p><p class="p1">Бах! Тим разрушил за́мок Диди.</p><p class="p1">Диди плачет. Перед ним кучка песка – всё, что осталось от его прекрасного за́мка.</p><p class="p1">– Зачем он так? – всхлипывает Диди. – Зачем Тим разрушил мой за́мок?</p><p class="p1">Другие малыши с удивлением смотрят на Тима. Что это с ним? Почему он так себя ведёт?</p><p class="p1">А Тим сердито потопал прочь. Он даже видеть никого не хочет.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_007.jpg"/>
</div><p class="empty-line"/><p class="p1">Вечером Тим выходит во двор. Как обычно, его друзья – Диди, Хьюго и Тесса – играют в футбол.</p><p class="p1">Тесса бьёт по мячу и кричит:</p><p class="p1">– Го-о-о-ол!</p><p class="p1">И точно: Диди на воротах пропустил мяч.</p><p class="p1">– Молодец, Тесса! – хвалит её Хьюго.</p><p class="p1">А мышонок Тим стоит в сторонке. Почему его не зовут играть?</p><p class="p1">«Ну я вам покажу! – думает Тим. – Раз вы меня не берёте, тогда играть не будете!»</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_008.jpg"/>
</div><p class="empty-line"/><p class="p1">Мышонок Тим схватил мяч и бросился бежать.</p><p class="p1">– Тим! – зовёт Тесса.</p><p class="p1">– Верни мяч! – кричит Хьюго.</p><p class="p1">А Диди догадался, что Тим это сделал от обиды:</p><p class="p1">– Тим! Давай играть вместе! Иди к нам!</p><p class="p1">Но Тим уже ничего не хочет слушать.</p><p class="p1">– Все плохие! – бормочет себе под нос Тим. – Все!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_009.jpg"/>
</div><p class="empty-line"/><p class="p1">Дома Тим сидит в уголке и жалуется своему игрушечному мишке Тедди.</p><p class="p1">– И не хотел я со всеми ссориться! Я только хотел выиграть! И чтобы мой за́мок был самый красивый. А ещё я хотел забить больше всех голов, – обиженно бормочет Тим.</p><p class="p1">Тедди внимательно слушает и как будто говорит Тиму: «Не расстраивайся, всё будет хорошо».</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_010.jpg"/>
</div><p class="empty-line"/><p class="p1">На другой день Тим снова идёт в детский сад. Но никто его не встречает, друзья не спешат ему навстречу, как было раньше.</p><p class="p1">Хьюго нарисовал красивую картинку и хвастается Тессе и Диди. А Тиму он рисунок не показал.</p><p class="p1">– Класс! Очень красиво! – хвалят Диди и Тесса.</p><p class="p1">Они стоят спиной к Тиму. Даже не смотрят на него!</p><p class="p1">Тим чувствует себя очень одиноким и никому не нужным.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_011.jpg"/>
</div><p class="empty-line"/><p class="p1">Конечно, воспитательница заметила, что Тим сидит один.</p><p class="p1">– Тим, Диди, Тесса, Хьюго, Фипси, – зовёт она. – Идите сюда. Рассказывайте, что у вас случилось.</p><p class="p1">Малыши подошли. Тим держится в сторонке. Он не решается встать рядом с друзьями.</p><p class="p1">– Ну же, Тим, подойди ближе, – подбадривает его воспитательница. – Давайте разберёмся, что не так.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_012.jpg"/>
</div><p class="empty-line"/><p class="p1">Малыши рассказали воспитательнице, что играть с Тимом трудно. Он всё время злится и портит игру.</p><p class="p1">– Почему ты злишься, Тим? – спросила воспитательница.</p><p class="p1">– Потому что я хочу выигрывать!</p><p class="p1">– Все хотят выигрывать. Но быть первым всегда и во всём не получится. У кого-то лучше получается что-то одно, у кого-то – другое. Хьюго красиво рисует, а Тесса – играет в футбол, Фипси умеет танцевать, а Диди строит отличные замки из песка.</p><p class="p1">– А у меня ничего не получается! – говорит Тим, чуть не плача.</p><p class="p1">– Ты правда так думаешь? – удивляется Диди. – Но ведь это не так!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_013.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим хмуро слушает, что скажет Диди.</p><p class="p1">– Помнишь, когда мы состязались, кто быстрее поднимется на гору, ты был первым.</p><p class="p1">– Точно! – обрадовался Тим.</p><p class="p1">А Хьюго подхватил:</p><p class="p1">– И когда запускали воздушных змеев, твой поднялся выше всех!</p><p class="p1">Тим улыбается. Он совсем про это забыл!</p><p class="p1">– И никто на тебя тогда не злился, – добавила Фипси. – И не сломал твоего змея.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_014.jpg"/>
</div><p class="empty-line"/><p class="p1">– Давайте все возьмёмся за лапки и по очереди скажем, почему друзья – это здорово, – предложила воспитательница.</p><p class="p1">– С друзьями весело! И интересно! Можно похвастаться тем, что у тебя получается, – стали перечислять малыши.</p><p class="p1">– Всё верно! – похвалила воспитательница. – А теперь пойдёмте играть все вместе. И никто не будет обижаться и злиться оттого, что проигрывает, договорились?</p><p class="p1">– Договорились! – закричали все хором, и Тим вместе с ними.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_015.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_016.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_017.jpg"/>
</div></span>
