<div class="title">
<p class="p">Анна Казалис</p>
<p class="p">Мышонок Тим идет в детский сад</p>
</div>
<span><div class="image">
<img class="z1" alt="" src="images/i_001.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_002.jpg"/>
</div><p class="empty-line"/><p class="p1">Topo Tip non vuole andare all’asilo</p><p class="p1">From an idea by <div class="image">
<img class="z1" alt="" src="images/i_004.png"/>
</div> Andrea Dami</p><p class="p1">Illustrations by Marco Campanella</p><p class="p1">Texts by Anna Casalis</p><p class="p1">Graphic design by Stefania Pavin</p><p class="p1">© 2018 Giunti Editore S.p.A., Milano-Firenze Dami International, a brand of Giunti Publishing Group www.giunti.it</p><p class="p1">© ООО «РОСМЭН», 2019</p></span>
<span><p class="subtitle">* * *</p><p class="p1">Сегодня мышонок Тим первый раз идёт в детский сад. Мама надела на него зелёный халатик и повязала голубой бант. Но Тим недоволен.</p><p class="p1">– Не хочу! Не хочу! – визжит он и упирается изо всех сил. – Не хочу в детский сад! И мой медвежонок тоже не хочет! Мы хотим остаться дома, с тобой!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_005.jpg"/>
</div><p class="empty-line"/><p class="p1">Мама ещё чуть-чуть поуговаривала мышонка, а потом сказала:</p><p class="p1">– Ладно, Тим. В садик сегодня не пойдёшь, посидишь со мной, пока я занимаюсь домашними делами.</p><p class="p1">И мама стала гладить бельё. Тим рад, что остался с мамой! Он стоит и наблюдает за ней.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_006.jpg"/>
</div><p class="empty-line"/><p class="p1">Теперь маме нужно помыть пол.</p><p class="p1">«Скорей бы она закончила! – думает мышонок. – А то мне скучно!»</p><p class="p1">Но маме некогда с ним играть: у неё много дел.</p><p class="p1">Наконец мама закончила все домашние дела.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_007.jpg"/>
</div><p class="empty-line"/><p class="p1">Но тут – дзинь-дзинь-дзинь! – звонит телефон.</p><p class="p1">Это тётя Пеппа. Ей столько всего нужно рассказать маме Тима!</p><p class="p1">– Когда они уже наговорятся? – ворчит мышонок и тянет маму за юбку.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_008.jpg"/>
</div><p class="empty-line"/><p class="p1">Теперь мама с Тимом идут в магазин. По дороге они встретили мамину лучшую подругу. Мама спешит рассказать ей, что нового у тёти Пеппы.</p><p class="p1">Они болтают и болтают…</p><p class="p1">– Как ску-у-учно! – ноет Тим и вдруг видит детский сад. Совсем рядом!</p><p class="p1">«Пойду-ка я посмотрю, что там делается!» – решает мышонок.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_009.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим заглянул в окошко детского сада, а там его друзья! Они играют и рисуют. И на всех зелёные халатики – точно такие же, как тот, что на него утром надела мама.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_010.jpg"/>
</div><p class="empty-line"/><p class="p1">«Ага! Халатики для того, чтобы не запачкать одежду, – догадался Тим. – Здорово! Даже если измажешься в краске, никто ругать не станет».</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_011.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим смотрит, как детям весело вместе, и вздыхает.</p><p class="p1">Наступил вечер, и Тим ложится спать.</p><p class="p1">– Мама, ничего, если я завтра не буду сидеть с тобой дома, а пойду в детский сад?</p><p class="p1">– Конечно, малыш, – смеётся мама. – Я очень рада, что ты понял, что в детском саду интересно!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_012.jpg"/>
</div><p class="empty-line"/><p class="p1">На следующее утро Тим, едва вскочив с кровати, тут же нацепил зелёный халатик и, довольный, отправился в детский сад. И любимого мишку Тедди взял с собой.</p><p class="p1">– Привет, Тим! – Друзья бросились ему навстречу. – Наконец-то ты пришёл! Давай играть!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_013.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим прижимает к себе медвежонка и катится с горки.</p><p class="p1">– Ух ты! Я лечу! – кричит он. – Захожу на посадку!</p><p class="p1">Как же весело в детском саду! Тут столько игр! Дома таких нет. И с друзьями играть интереснее, чем одному.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_014.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим устал и захотел спать. И тут как раз тихий час. Все малыши ложатся под одеяльца.</p><p class="p1">– Спокойного сна! – говорит воспитательница, но мышонок Тим не слышит – он уже крепко спит.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_015.jpg"/>
</div><p class="empty-line"/><p class="p1">После тихого часа малыши снова играли. И вот наступил вечер. За Тимом пришли мама и папа.</p><p class="p1">– Как? Уже пора домой? – удивляется Тим.</p><p class="p1">Какой это был чудесный день!</p><p class="p1">Но и по маме с папой мышонок соскучился, сейчас он им всё-всё расскажет!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_016.jpg"/>
</div><p class="empty-line"/><p class="p1">– Мне понравилось в садике! – шепчет он папе. – Я играл, рисовал, пел, ел, спал и снова играл. Воспитательница очень хорошая. А завтра я снова сюда приду!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_017.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_018.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_019.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_020.jpg"/>
</div></span>
