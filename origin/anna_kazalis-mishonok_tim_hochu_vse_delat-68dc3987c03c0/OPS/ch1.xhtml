<div class="title">
<p class="p">Анна Казалис</p>
<p class="p">Мышонок Тим. Хочу все делать сам!</p>
</div>
<span><div class="image">
<img class="z1" alt="" src="images/i_002.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_003.jpg"/>
</div><p class="empty-line"/><p class="p1">Topo Tip vuole fare tutto da solo</p><p class="p1">From an idea by <div class="image">
<img class="z1" alt="" src="images/i_004.png"/>
</div> Andrea Dami</p><p class="p1">Illustrations by Marco Campanella</p><p class="p1">Texts by Anna Casalis</p><p class="p1">Graphic design by Stefania Pavin</p><p class="p1">© 2022 Giunti Editore S.p.A., Milano-Firenze Dami International, a brand of Giunti Publishing Group www.giunti.it</p><p class="p1">© ООО «РОСМЭН», 2022</p></span>
<span><p class="subtitle">* * *</p><p class="p1">Мышонок Тим идёт в детский сад, и мама, как обычно, держит его за лапку. По пути они весело болтают.</p><p class="p1">Вдруг Тим замер и вырвал у мамы свою лапку.</p><p class="p1">– Сегодня я один зайду в сад! – говорит он. – А ты оставайся здесь. Я сам хочу!</p><p class="p1">Тим подбежал к воспитательнице:</p><p class="p1">– Здрасте! Видите, я сам пришёл, потому что я уже большой!</p><p class="p1">Мама улыбнулась: как быстро растут дети.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_005.jpg"/>
</div><p class="empty-line"/><p class="p1">В садике обед. Дети уже поели суп и второе, а теперь жуют фрукты.</p><p class="p1">– Кто мне поможет принести воды? – спрашивает воспитательница.</p><p class="p1">– Я! Я! – закричали хором Тим и Джоди и со всех лап бросились за воспитательницей на кухню.</p><p class="p1">Она набрала воды в огромный кувшин.</p><p class="p1">– Осторожно: кувшин очень тяжёлый – несите его вдвоём, – говорит воспитательница.</p><p class="p1">Тим и Джоди вместе взяли кувшин. Им приходится идти медленно-медленно, чтобы не расплескать воду.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_006.jpg"/>
</div><p class="empty-line"/><p class="p1">Но Тиму так не нравится.</p><p class="p1">– Дай мне! Я сам донесу, и намного быстрее! – крикнул он и рванул кувшин на себя.</p><p class="p1">Плюх! Ох, сколько воды выплеснулось на бедного Джоди!</p><p class="p1">– Что ты делаешь?! Я теперь весь мокрый! – пискнул он.</p><p class="p1">Прибежала воспитательница.</p><p class="p1">– Не переживай, Джоди, сейчас мы найдём для тебя сухую одежду. А ты, Тим, запомни: надо учиться делать дела вместе. Я же сказала вам нести кувшин вдвоём.</p><p class="p1">Тиму жалко Джоди. Он не хотел облить друга! Тим хотел только, чтобы воспитательница поняла, какой он большой и сильный!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_007.jpg"/>
</div><p class="empty-line"/><p class="p1">После обеда воспитательница говорит:</p><p class="p1">– А сейчас, дети, мы будем с вами мастерить яркие, красивые вертушки. Слушайте внимательно, я вам буду говорить, что делать.</p><p class="p1">Все ребята навострили ушки.</p><p class="p1">А мышонок Тим подумал: «Какая ерунда! Не буду я слушать воспитательницу. Вертушка – это легкотня. Сам справлюсь!»</p><p class="p1">И тут же взялся за ножницы и бумагу.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_008.jpg"/>
</div><p class="empty-line"/><p class="p1">Скажу тебе по секрету, мастерить вертушку и правда несложно, если знаешь как. Но Тим не знал.</p><p class="p1">У всех ребят, которые внимательно слушали воспитательницу, получились замечательные вертушки.</p><p class="p1">– Смотри, Тим, крутится! – хвастается Джоди. – Какая красота!</p><p class="p1">А у Тима вертушка не крутится, а разваливается. Почему же так получилось?</p><p class="p1">– Знаешь, Тедди, – говорит Тим своему мишке. – Наверно, всё-таки надо было делать вертушку вместе с остальными.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_009.jpg"/>
</div><p class="empty-line"/><p class="p1">Вечером мама забрала Тима из садика. Они идут домой.</p><p class="p1">– Держи меня за руку, – говорит мама. – На улице очень много машин.</p><p class="p1">– Ну, мам! Я же уже большой! Я хочу идти сам. Я лучше буду везти свою машинку.</p><p class="p1">У Тима игрушечная машинка, он хочет катить её по тротуару.</p><p class="p1">– Вж-ж-ж-ж! – кричит Тим и бежит вперёд.</p><p class="p1">Но мама поймала его за руку.</p><p class="p1">– Пусти! – кричит Тим. – Я сам хочу!</p><p class="p1">Мама не пускает и крепко держит Тима, а вот машинка сама по себе выкатилась на дорогу и попала под большую машину!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_010.jpg"/>
</div><p class="empty-line"/><p class="p1">Дыщ!</p><p class="p1">Бабах!</p><p class="p1">Ой-ой-ой!</p><p class="p1">Любимая машинка Тима разлетелась вдребезги.</p><p class="p1">Тим плачет.</p><p class="p1">– Ну почему так?</p><p class="p1">– Ох, малыш, – говорит мама. – Жалко машинку, но её уже не починить.</p><p class="p1">Мышонок обнимает маму. Он испугался, но ещё больше расстроился.</p><p class="p1">– Плохая, плохая машинища! – кричит Тим. – Зачем она раздавила мою игрушку?</p><p class="p1">– Машины не плохие, – говорит мама, – просто большие и опасные. Поэтому так важно, чтобы я тебя держала за руку, когда мы идём по улице. Ты ведь не хочешь сам оказаться под колёсами, правда?</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_011.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим дома. Вместе с папой они думают, что приготовить на ужин.</p><p class="p1">– Давай сделаем морковный суп! – говорит мышонок.</p><p class="p1">– Давай! – соглашается папа. – Неси морковку.</p><p class="p1">Но Тим решил, что лучше он достанет кастрюлю. Сам! Тим знает, что для супа нужна самая большая. Тим встал на цыпочки и тянется, тянется… вот ещё чуть-чуть… ещё капельку…</p><p class="p1">Бубух!</p><p class="p1">Кастрюля упала на пол. Какой страшный грохот!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_012.jpg"/>
</div><p class="empty-line"/><p class="p1">Папа кинулся к Тиму, но с ним всё в порядке, он просто испугался. Да и папа испугался не меньше!</p><p class="p1">– Прости, папочка, – пискнул мышонок.</p><p class="p1">Ему очень стыдно. Уронил посуду, примял цветок…</p><p class="p1">– Ничего, ничего, малыш, – говорит папа. – Главное, что ты не поранился. Но почему ты меня не попросил достать кастрюлю, если не дотягиваешься? Ты же знаешь, я всегда с радостью тебе помогу. Ну не беда: сейчас приберёмся.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_013.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим у себя в комнате. Он играет. Храбрый рыцарь Тим защищает короля Тедди. Но вот битва кончилась. Королевство спасено!</p><p class="p1">– Ну что, мой герой, – говорит мама, заходя в комнату, – мне кажется, королю Тедди пора спать. Да и храброму рыцарю тоже. Давай уберём игрушки. Вдвоём быстро справимся.</p><p class="p1">Но Тим хочет всё делать сам. Где это видано, чтобы мама убирала за рыцаря его меч? Ну уж нет, он справится и без маминой помощи!</p><p class="p1">– Хорошо, убери сам, – говорит мама. – Но поспеши, а то у нас не останется времени на сказку перед сном.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_014.jpg"/>
</div><p class="empty-line"/><p class="p1">Через некоторое время мама вернулась, а Тим всё возится. Он даже не догадывался, что у него так много игрушек!</p><p class="p1">– Мамочка, ты мне не поможешь? – смущённо спросил Тим.</p><p class="p1">Ему очень хочется послушать сказку.</p><p class="p1">– Конечно, помогу! – улыбнулась мама. – Давай играть, как будто мы охотники за игрушками. Хватай игрушки и кидай в коробки. Детальки от конструктора – в эту, мячики – в ту… Ну, кто быстрее?</p><p class="p1">Раз-два и готово! Вместе с мамой они мигом убрали все игрушки.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_015.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим лёг в кроватку, а мама взяла книжку.</p><p class="p1">– Сегодня я прочитаю тебе про кошечку Лолу. «Кошечка Лола всё хотела делать сама. Она считала, что уже большая и помощь ей не нужна…»</p><p class="p1">– Я тоже! Я тоже думал, что уже большой. А потом уронил кастрюлю… – вздохнул Тим.</p><p class="p1">– «„Только малыши просят помощи“, – думала кошечка Лола. И даже вместе с друзьями ничего не хотела делать».</p><p class="p1">– А мы с Джоди вместе несли кувшин с водой! – похвастался Тим.</p><p class="p1">– Вот молодцы! – Мама погладила его по голове.</p><p class="p1">Тиму понравилась история про кошечку. И знаешь, чем она закончилась? Как и Тим, кошечка поняла, как здорово делать что-то хорошее вместе с друзьями. А ещё узнала, что просить о помощи совсем не стыдно!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_016.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_017.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_018.jpg"/>
</div></span>
