<div class="title">
<p class="p">Анна Казалис</p>
<p class="p">Мышонок Тим не хочет спать</p>
</div>
<span><div class="image">
<img class="z1" alt="" src="images/i_002.jpg"/>
</div><p class="empty-line"/><p class="p1">Topo Tip non fa la nanna</p><p class="p1">From an idea <div class="image">
<img class="z1" alt="" src="images/i_003.png"/>
</div> by Andrea Dami</p><p class="p1">Illustrations by Marco Campanella</p><p class="p1">Texts by Anna Casalis</p><p class="p1">Graphic design by Stefania Pavin</p><p class="p1">© 2018 Giunti Editore S.p.A., Milano-Firenze Dami International, a brand of Giunti Publishing Group www.giunti.it</p><p class="p1">© ООО «РОСМЭН», 2019</p></span>
<span><p class="subtitle">* * *</p><p class="p1">Уже вечер. Мышонок Тим только что поужинал.</p><p class="p1">– Обожаю сырный суп! – говорит мышонок и облизывает ложку.</p><p class="p1">Медвежонок Тедди, его лучший друг, сидит на полу рядом с его стульчиком.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_004.jpg"/>
</div><p class="empty-line"/><p class="p1">Мышонок идёт к себе в комнату и переодевается. Тим очень любит свою мягкую пижамку. Она чистая, свежепостиранная. Даже стиральным порошком ещё пахнет. А на груди – смешной месяц. Это мама вышила!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_005.jpg"/>
</div><p class="empty-line"/><p class="p1">Потом мышонок Тим топает в ванную. Моет с мылом усики, умывает мордочку и чистит зубки. Мышонок Тим знает, что перед сном надо обязательно чистить зубы, чтобы они не болели.</p><p class="p1">– Не забудь закрыть тюбик! – напоминает мама.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_006.jpg"/>
</div><p class="empty-line"/><p class="p1">Наконец Тим ложится в кроватку, накрывается одеялом и укладывает рядом своего любимого медвежонка.</p><p class="p1">– Мама, я готов! Почитаешь мне перед сном? Я хочу сказку длинную-предлинную и чтобы там было много-много приключений!</p><p class="p1">– Хорошо, – говорит мама. – Но длинную сказку мы не прочитаем за один вечер.</p><p class="p1">– Ничего, – соглашается мышонок.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_007.jpg"/>
</div><p class="empty-line"/><p class="p1">Мама читает долго-долго. Мышонку очень интересно. Но вот уже мама зевает – она устала за день, а Тиму так не терпится узнать, что было дальше.</p><p class="p1">– Всё, малыш, на сегодня хватит, – говорит мама.</p><p class="p1">– Как? Но сказка же ещё не кончилась! – возмущается Тим.</p><p class="p1">– Дочитаем завтра, – обещает мама. – А теперь спи, уже очень поздно!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_008.jpg"/>
</div><p class="empty-line"/><p class="p1">Мама целует Тима и выходит из комнаты.</p><p class="p1">Тим вертится в кроватке. Ему не хочется спать. Он вскакивает и тащит за собой медвежонка.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_009.jpg"/>
</div><p class="empty-line"/><p class="p1">– Тедди, пойдём поищем маму.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_010.jpg"/>
</div><p class="empty-line"/><p class="p1">Родители уже легли. Папа спит – ему рано вставать, а мама читает.</p><p class="p1">– Мама, я пить хочу! Дай мне попить, и Тедди тоже.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_011.jpg"/>
</div><p class="empty-line"/><p class="p1">Мышонок выпивает целую бутылочку тёплого молока и ложится обратно в кровать.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_012.jpg"/>
</div><p class="empty-line"/><p class="p1">– Ох, как скучно в постели! – вздыхает Тим, глядя в потолок.</p><p class="p1">Сегодня ночью он никак не может уснуть.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_013.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим снова приходит к маме. В комнате родителей уже темно.</p><p class="p1">– Мама, мама, проснись! Я не могу заснуть. Почитай мне ещё!</p><p class="p1">– Тсс! Тише, Тим, не разбуди папу! – говорит мама.</p><p class="p1">Но папа спит крепко и тихонько храпит – даже длинные усы подрагивают.</p><p class="p1">– Мама, я не хочу ложиться в кровать! – пищит Тим. – Зачем вообще спать?</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_014.jpg"/>
</div><p class="empty-line"/><p class="p1">Мама встаёт, берёт Тима на ручки и вместе с ним подходит к окну.</p><p class="p1">– Видишь, Тим, уже ночь, вокруг темно, и все спят: цветы, лесные звери и даже солнышко. Ночь нужна для того, чтобы отдохнуть, а утром проснуться бодрым и весёлым.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_015.jpg"/>
</div><p class="empty-line"/><p class="p1">Мама укачивает Тима, и наконец мышонок засыпает. Ему снится огромный кусок сыра, вкусного-превкусного! И ещё много разных игрушек.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_016.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_017.jpg"/>
</div><p class="empty-line"/><p class="p1">А рано утром солнышко заглянуло в окно, протянуло лучик и пощекотало мышонку нос. Тим проснулся в отличном настроении.</p><p class="p1">– Доброе утро, Тедди! – кричит мышонок. – Давай скорее вставать, нам пора в детский сад! Я хочу рассказать друзьям, какой чудесный сон мне приснился!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_018.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_019.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_020.jpg"/>
</div></span>
