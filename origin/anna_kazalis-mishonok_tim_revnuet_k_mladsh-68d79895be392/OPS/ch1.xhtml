<div class="title">
<p class="p">Анна Казалис</p>
<p class="p">Мышонок Тим ревнует к младшей сестре</p>
</div>
<span><div class="image">
<img class="z1" alt="" src="images/i_001.jpg"/>
</div><p class="empty-line"/><p class="p1">Художник Марко Кампанелла</p><p class="p1">Пересказ Петра Лемени-Македона</p><p class="empty-line"/><p class="p1">Topo Tip. Ma io volevo un fratellino!</p><p class="p1">from an idea by <div class="image">
<img class="z1" alt="" src="images/i_003.jpg"/>
</div> Andrea Dami</p><p class="p1">Copyright © 2023 Giunti Editore S.p.A., Firenze-Milano</p><p class="p1">Dami International, a brand of Giunti Publishing Group</p><p class="p1">www.giunti.it</p><p class="p1">© ООО «РОСМЭН», 2023</p></span>
<span><p class="subtitle">* * *</p><p class="p1">– Мам, пап, поиграйте со мной!</p><p class="p1">Мышонок Тим только что вернулся из детского сада. Он там целый день играл, но ему хочется ещё.</p><p class="p1">– Малыш, папа устал после работы и собирается отдохнуть, – говорит мышонку мама, – а мне надо готовить ужин. Пойди во двор, поиграй с ребятами!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_004.jpg"/>
</div><p class="empty-line"/><p class="p1">Оказалось, ребята уже разошлись по домам. Тим тоже побрёл обратно.</p><p class="p1">– Во дворе никого нет, – жалуется мышонок папе. – Конечно, у ребят же есть братики или сестрички! А мне даже поиграть не с кем!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_005.jpg"/>
</div><p class="empty-line"/><p class="p1">– Не расстраивайся, малыш! – Папа отложил газету. – А хочешь посмотреть на нас с мамой, когда мы были маленькие? Неси-ка альбом!</p><p class="p1">– Пап, ты тут такой смешной! А кто это рядом с тобой на качелях?</p><p class="p1">– Это мой брат Том. Мы иногда ссорились, но всё равно были не разлей вода!</p><p class="p1">– Мне тоже повезло с сестрой, – говорит мама. – В детстве всегда было с кем поиграть. И мы до сих пор во всём друг другу помогаем. Здо́рово, когда есть на кого положиться!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_006.jpg"/>
</div><p class="empty-line"/><p class="p1">На ужин мама приготовила вкусный морковный суп. Но Тим был какой-то задумчивый и почти не ел.</p><p class="p1">– Мам, пап, – сказал он вдруг. – Я придумал подарок на день рождения. Подари́те мне братика, хорошо? Я буду с ним играть!</p><p class="p1">Мама с папой переглянулись.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_007.jpg"/>
</div><p class="empty-line"/><p class="p1">– Тим, братика или сестричку не получится купить в магазине, как велосипед! – улыбнулась мама. – Но, вообще-то, идея отличная! Мы с папой подумаем.</p><p class="p1">Пришла осень. Как-то раз мама сказала:</p><p class="p1">– Тим, мне нужно к доктору. Поедешь со мной?</p><p class="p1">– Зачем тебе к доктору, мам? Ты переживаешь, что поправилась?</p><p class="p1">Интересно, почему мама смеётся?..</p><p class="p1">– Это даже хорошо, что мама поправилась, Тим! – сказал доктор. – Ей нужно хорошо кушать, ведь у неё в животике – малыш!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_008.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим счастлив. Наконец-то у него будет братик!</p><p class="p1">– Иди сюда, Тим, – зовёт мама. – Хочешь послушать, как малыш шевелится?</p><p class="p1">Тим прикладывает ухо к маминому животу.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_009.jpg"/>
</div><p class="empty-line"/><p class="p1">– Мам, он пинается! Наверное, футболистом вырастет! Купишь нам мячик? Эх, скорей бы поиграть вместе!</p><p class="p1">Пока мама вяжет ползунки и шьёт покрывало для колыбельки, Тим тоже готовится к появлению малыша.</p><p class="p1">– Подарю ему вот эти две машинки – они почти как новые, – рассуждает мышонок, – а ещё кубики, самолётик, ракету…</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_010.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим каждый день мечтает о том, как будет играть с братиком.</p><p class="p1">И вот как-то раз мама возвращается домой не одна…</p><p class="p1">Тим вбегает в комнату к маме.</p><p class="p1">– Он уже тут? Здо́рово! Можно посмотреть?</p><p class="p1">– Познакомься, Тим, – сказала мама. – Это твоя сестричка. Правда красивая?</p><p class="p1">– Как это сестричка? – не понял Тим. – Я же братика просил, а не сестричку! Что мне с ней, в куклы играть, что ли?</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_011.jpg"/>
</div><p class="empty-line"/><p class="p1">Мышонок Тим ужасно расстроился.</p><p class="p1">А ещё Тим ревнует. В гости пришли бабушка с дедушкой и принесли сестричке и маме уйму подарков. И все говорят про малышку: «Какая красавица!»</p><p class="p1">А про Тима забыли!</p><p class="p1">– И зачем я попросил такое на день рождения! – буркнул Тим. – Теперь мама с папой вообще перестанут со мной играть!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_012.jpg"/>
</div><p class="empty-line"/><p class="p1">Тем временем пошёл снег. Он всё падал и падал. Вскоре домик мышонка Тима накрыло тяжёлым белым одеялом.</p><p class="p1">И вдруг… КРАК! Старая крыша не выдержала и провалилась прямо над комнаткой, где спала маленькая сестричка мышонка Тима.</p><p class="p1">– Мам! Пап! – закричал мышонок Тим.</p><p class="p1">Но медлить нельзя! Пока родители спешили на помощь, Тим добрался до колыбельки и подхватил сестрёнку на руки. Малышка крепко вцепилась в брата, и оба выбрались в безопасное место целыми и невредимыми.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_013.jpg"/>
</div><p class="empty-line"/><p class="p1">– Молодчина, Тим! – похвалил папа.</p><p class="p1">– Мы так тобой гордимся! – воскликнула мама.</p><p class="p1">– Видели? Если бы не я… Теперь я понял: я очень нужен сестрёнке. Глядите, как она на меня смотрит! Всё-таки она хорошенькая… И ничего, что это не братик. Вот подрастёт, и я научу её играть в футбол!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_014.jpg"/>
</div><p class="empty-line"/><p class="p1">– Ну конечно, научишь! – ответила мама. – Научишь, чему захочешь. Только ты должен знать: это большая ответственность. Учи сестру только хорошему!</p><p class="p1">На день рождения Тиму подарили ещё один чудесный подарок.</p><p class="p1">– Спасибо, мам, спасибо, пап! – радуется Тим. – Какая классная машина! Ещё и с двумя сиденьями! Будем с сестрой вместе кататься. Обещаю, буду водить аккуратно!</p><p class="p1">А маленькая сестрёнка улыбается и восхищённо глядит на своего замечательного старшего брата.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_015.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_001.jpg"/>
</div></span>
