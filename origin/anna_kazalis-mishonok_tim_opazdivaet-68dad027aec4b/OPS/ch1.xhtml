<div class="title">
<p class="p">Анна Казалис</p>
<p class="p">Мышонок Тим опаздывает</p>
</div>
<span><div class="image">
<img class="z1" alt="" src="images/i_002.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_003.jpg"/>
</div><p class="empty-line"/><p class="p1">Topo Tip, fai in fretta!</p><p class="p1">Copyright © 2021 Giunti Editore S.p.A., Milano-Firenze</p><p class="p1">Dami International, a brand of Giunti Publishing Group</p><p class="p1">www.giunti.it</p><p class="p1">© ООО «РОСМЭН», 2022</p></span>
<span><p class="subtitle">* * *</p><p class="p1">– Тим! Просыпайся! – Мама подходит к кроватке мышонка. – Вставай, а то опоздаешь в детский сад.</p><p class="p1">Но мышонку Тиму не хочется вылезать из постели. Ему снится такой интересный сон! Тим зажмуривается, чтобы сон не убежал.</p><p class="p1">Мама гладит мышонка по голове:</p><p class="p1">– Ну же, малыш, вставай! Завтрак почти готов.</p><p class="p1">– Сейчас, – бормочет Тим и натягивает на себя одеяло.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_004.jpg"/>
</div><p class="empty-line"/><p class="p1">– Поднимайся, а то опять заснешь! – говорит мама и уходит на кухню.</p><p class="p1">Завтрак почти готов. Может быть, Тим почует, как вкусно пахнет? Или заметит, что солнце заглядывает в комнату и будто говорит: «Смотри, Тим, какой чудесный день за окном!»</p><p class="p1">Но нет, Тим прижался щекой к подушке и посапывает.</p><p class="p1">– Ти-и-им! Вставай! – кричит из кухни мама.</p><p class="p1">– Ещё немножко полежу и встану, – шепчет Тим своему игрушечному медвежонку.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_005.jpg"/>
</div><p class="empty-line"/><p class="p1">«Только досмотрю сон, – думает мышонок. – И вообще, ничего страшного, если я встану попозже»</p><p class="p1">Тим переворачивается на другой бок и снова засыпает.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_006.jpg"/>
</div><p class="empty-line"/><p class="p1">Мама заходит к Тиму. Она думала, что он уже умылся и оделся…</p><p class="p1">– Тим! Ты ещё в кровати?! Скорее вставай! Мы же опоздаем: я на работу, а ты в детский сад. Ты забыл, что у вас сегодня экскурсия?</p><p class="p1">Экскурсия! Точно! Она-то Тиму и снилась! Неужели он теперь всё пропустит?!</p><p class="p1">Раз! И Тим вскочил с постели.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_007.jpg"/>
</div><p class="empty-line"/><p class="p1">Мышонок умылся и пришёл на кухню. Мама, папа и даже сестрёнка Тима Лили – все уже заканчивают завтракать.</p><p class="p1">– Мама, я хочу ещё блинчиков, пожарь мне ещё! – просит мышонок Тим. – Мы с мишкой не наелись.</p><p class="p1">Тим берёт ложечку и начинает кормить своего игрушечного медвежонка кашей.</p><p class="p1">– Нет, Тим, у нас нет времени, – говорит мама. – Доедай скорее кашу и пойдём.</p><p class="p1">Но мишка ест о-о-очень медленно.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_008.jpg"/>
</div><p class="empty-line"/><p class="p1">Наконец Тим оделся и даже своему мишке повязал ленточку на шею – они же сегодня едут на экскурсию!</p><p class="p1">И вдруг под кроватью Тим увидел Синего рыцаря. Он искал его вчера весь вечер! Так вот он где спрятался!</p><p class="p1">Тим радостно схватил рыцаря и отнёс в за́мок. Его надо посадить вот сюда, на стену. Рыцарь будет охранять за́мок. А в за́мке – принцесса. Дракон придёт, и рр-ры!..</p><p class="p1">– Ти-и-им! – зовёт мама. Она уже сердится.</p><p class="p1">Тим заигрался и совсем забыл, что надо спешить.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_009.jpg"/>
</div><p class="empty-line"/><p class="p1">По дороге в детский сад они проходят мимо магазина, а там, в витрине, Тим видит Зелёного рыцаря!</p><p class="p1">– Мама! Купи мне Зелёного рыцаря! У меня такой же Синий. Они вместе будут защищать за́мок.</p><p class="p1">– Тим, не сейчас, – говорит мама. Она толкает коляску с Лили и тянет Тима за руку. – В другой раз, когда у нас будет время.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_010.jpg"/>
</div><p class="empty-line"/><p class="p1">Воспитательница ждёт их у детского сада. Все дети давно собрались.</p><p class="p1">– А вот и ты, Тим! Мы уже думали, что ты не придёшь! Чуть без тебя не уехали, – шутит воспитательница.</p><p class="p1">Мама Тима извиняется. Ей неловко, что все их ждали.</p><p class="p1">– Тим, Тим, садись скорее! – кричат мышонку друзья, когда он заходит в автобус. – Мы только тебя ждём!</p><p class="p1">– Простите, – бормочет Тим. Ему вдруг тоже становится стыдно.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_011.jpg"/>
</div><p class="empty-line"/><p class="p1">После очень интересной экскурсии автобус привёз всех обратно в детский сад. Дети расходятся по домам – за ними пришли мамы и папы.</p><p class="p1">– Пока, Тим!</p><p class="p1">– До завтра! – Друзья машут ему на прощание.</p><p class="p1">А вот Тима никто не забирает.</p><p class="p1">– Где моя мама? Почему она не идёт? – вздыхает Тим.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_012.jpg"/>
</div><p class="empty-line"/><p class="p1">Все разошлись. Тим остался один с воспитательницей.</p><p class="p1">– Мама что, забыла про меня? – всхлипывает мышонок.</p><p class="p1">– Нет, Тим, конечно нет! – успокаивает его воспитательница. – Твоя мама позвонила и предупредила, что задержится. Тебе придётся подождать.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_013.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_014.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим снова вздыхает. Ждать ужасно скучно!</p><p class="p1">– Давай я расскажу тебе сказку, – предлагает воспитательница, – и время пролетит быстрее.</p><p class="p1">Но для Тима время не летит, а тянется медленно-медленно.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_015.jpg"/>
</div><p class="empty-line"/><p class="p1">Наконец мама пришла за ним. Тиму не терпится скорее пойти домой, но маме нужно ещё поговорить с воспитательницей.</p><p class="p1">Они говорят и говорят.</p><p class="p1">– Сколько можно?! – возмущается Тим. – Пойдём домой! Я хочу есть! Я устал! Мне скучно!</p><p class="p1">– Торопишься? – улыбается мама. – Что-то утром ты так не торопился. И я тебя ждала.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_016.jpg"/>
</div><p class="empty-line"/><p class="p1">Мама присаживается рядом с Тимом.</p><p class="p1">– Малыш, я же опоздала с утра на работу, и мне пришлось задержаться вечером. Поэтому я позвонила твоей воспитательнице и предупредила её, что задержусь. Не сердись. Пойдём лучше поскорее домой, а то папа и Лили нас уже, наверное, потеряли.</p><p class="p1">– Пойдём, – соглашается Тим. Он больше не сердится на маму, но ждать ему совсем не понравилось.</p><p class="p1">Всю дорогу домой мышонок Тим думал.</p><p class="p1">А вечером… Мама и папа ужасно удивились, когда Тим раньше, чем обычно, сам переоделся в пижаму и почистил зубы.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_017.jpg"/>
</div><p class="empty-line"/><p class="p1">– Что это с тобой, Тим? – спросил папа с улыбкой.</p><p class="p1">А Мышонок Тим сказал:</p><p class="p1">– Я подумал: если я раньше лягу, я смогу посмотреть больше снов ночью, успею съесть утром больше блинчиков и, может быть, даже смогу немножко поиграть с рыцарем. И мама не опоздает на работу, и мне не придётся её ждать. И вообще никому никого ждать не придётся! Вот!</p><p class="p1">– Молодец! – сказал папа, а мама рассмеялась и обняла своего мышонка.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_018.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_019.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_020.jpg"/>
</div></span>
