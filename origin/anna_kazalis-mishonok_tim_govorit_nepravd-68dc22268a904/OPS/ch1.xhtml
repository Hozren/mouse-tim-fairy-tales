<div class="title">
<p class="p">Анна Казалис</p>
<p class="p">Мышонок Тим говорит неправду</p>
</div>
<span><div class="image">
<img class="z1" alt="" src="images/i_002.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_003.jpg"/>
</div><p class="empty-line"/><p class="p1">Topo Tip. Mamma, non andare a lavorare!</p><p class="p1">From an idea by <div class="image">
<img class="z1" alt="" src="images/i_004.png"/>
</div> Andrea Dami</p><p class="p1">Illustrations by Marco Campanella</p><p class="p1">Texts by Anna Casalis</p><p class="p1">Graphic design by Stefania Pavin</p><p class="p1">© 2021 Giunti Editore S.p.A., Milano-Firenze Dami International, a brand of Giunti Publishing Group www.giunti.it</p><p class="p1">© ООО «РОСМЭН», 2021</p></span>
<span><p class="subtitle">* * *</p><p class="p1">Сегодня мама читает мышонку Тиму книжку про Буратино.</p><p class="p1">– Фу, какой он врунишка! – смеётся Тим. – Поэтому нос у него длиннющий!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_005.jpg"/>
</div><p class="empty-line"/><p class="p1">Мама готовит, а Тим рассматривает картинки в книжке.</p><p class="p1">– Мой лапки, малыш, сейчас будем ужинать, – говорит мама.</p><p class="p1">– Я уже помыл, – хитрит Тим. Ему не хочется отрываться от книжки.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_006.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_007.jpg"/>
</div><p class="empty-line"/><p class="p1">– Ну зачем ты меня обманываешь? – говорит мама. – Ты ведь не мыл лапки. Посмотри сам: на них и песок, и следы от мелков! Ты что, такой же врунишка, как Буратино?</p><p class="p1">Тим скашивает глаза, стараясь заглянуть на свой нос.</p><p class="p1">«Уф, вроде не вырос», – с облегчением думает он.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_008.jpg"/>
</div><p class="empty-line"/><p class="p1">После ужина мышонок Тим немного поиграл. А потом пришла мама:</p><p class="p1">– Пора спать. Надевай пижаму и иди чистить зубы. А когда ляжешь в кроватку, я приду и прочитаю тебе ещё одну главу про Буратино.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_009.jpg"/>
</div><p class="empty-line"/><p class="p1">– Ну-ка покажи зубки, – просит мама. – Ох, Тим, ты же их совсем не чистил!</p><p class="p1">– Я не нашёл зубную щётку, – говорит Тим.</p><p class="p1">– Не нашёл? Ну и ну! Я только что была в ванной: щётка на месте. Как не стыдно врать?</p><p class="p1">Мама очень огорчилась.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_010.jpg"/>
</div><p class="empty-line"/><p class="p1">Утром мама заметила, что пропала баночка с вареньем.</p><p class="p1">– Тим, ты не брал варенье?</p><p class="p1">– Нет… не брал! – пискнул Тим. А у самого усы от варенья липкие!</p><p class="p1">Мышонку Тиму стыдно врать, но и признаваться не хочется.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_011.jpg"/>
</div><p class="empty-line"/><p class="p1">– Тим! – кричит мама. – Можешь мне объяснить, как банка из-под варенья попала к тебе в кровать?</p><p class="p1">– Её принёс мой мишка! – отвечает Тим и зажмуривается от стыда. Он прекрасно понимает, что это враньё совсем не похоже на правду.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_012.jpg"/>
</div><p class="empty-line"/><p class="p1">– Тим, ну сколько раз тебе говорить: врать нехорошо. Во-первых, врут только трусы, во-вторых, врать просто глупо. Все иногда ошибаются. Но надо признавать свои ошибки.</p><p class="p1">– Прости, мамочка! Я больше не буду врать! – обещает Тим.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_013.jpg"/>
</div><p class="empty-line"/><p class="p1">Тиму стало радостно и весело, и он пошёл поиграть в саду.</p><p class="p1">– Папа, смотри, как быстро я умею бегать! – кричит Тим. – Я могу обогнать даже машину!</p><p class="p1">Папа отложил газету и посмотрел на сына:</p><p class="p1">– Тим, не хвастай. Хвастовство не лучше вранья.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_014.jpg"/>
</div><p class="empty-line"/><p class="p1">Но тут в сад вышла мама.</p><p class="p1">– Тим! Ты что наделал?! Взял и разбил скульптуру! Это же портрет твоего прадедушки. – Мама очень сильно разозлилась. – Всё, ты наказан! Марш в свою комнату!</p><p class="p1">– Это не я, – плачет Тим. – Я её не трогал!</p><p class="p1">Но мама даже слушать не стала.</p><p class="p1">– Хватит. Мне надоело твоё враньё!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_015.jpg"/>
</div><p class="empty-line"/><p class="p1">А через некоторое время раздался стук в дверь. Это пришла соседка.</p><p class="p1">– Извините, – сказала она. – Мой малыш катался на велосипеде и разбил скульптуру у вас в саду. Надеюсь, её можно склеить.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_016.jpg"/>
</div><p class="empty-line"/><p class="p1">Мама и папа обняли мышонка Тима.</p><p class="p1">– Прости, что мы тебе не поверили, – сказали они. – Но до этого ты очень часто говорил неправду. Теперь понимаешь, почему так плохо врать?</p><p class="p1">– Понимаю! – вздохнул Тим и ласково прижался к папе и маме.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_017.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_018.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_019.jpg"/>
</div><p class="empty-line"/><div class="image">

</div></span>
