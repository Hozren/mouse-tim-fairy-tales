<div class="title">
<p class="p">Анна Казалис</p>
<p class="p">Мышонок Тим. А что вы мне подарите?</p>
</div>
<span><div class="image">
<img class="z1" alt="" src="images/i_002.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_003.jpg"/>
</div><p class="empty-line"/><p class="p1">Topo Tip. Oggi è il mio compleanno!</p><p class="p1">From an idea by <div class="image">
<img class="z1" alt="" src="images/i_004.png"/>
</div> Andrea Dami</p><p class="p1">Copyright© 2022 Giunti Editore S.p.A., Milano-Firenze Dami International, a brand of Giunti Publishing Group</p><p class="p1">Graphic design by Stefania Pavin</p><p class="p1">www.giunti.it</p><p class="p1">© ООО «РОСМЭН», 2022</p></span>
<span><p class="subtitle">* * *</p><p class="p1">Мышонок Тим в детском саду. Но он не играет с друзьями, а стоит в сторонке и шепчется со своим медвежонком Тедди. Дело в том, что через пять дней у Тима день рождения. Он только и думает что о подарках.</p><p class="p1">– Знаешь, Тедди, что я хочу получить? – говорит Тим медвежонку на ушко. – Ве-ло-си-пед!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_005.jpg"/>
</div><p class="empty-line"/><p class="p1">Вечером мама забрала Тима из детского сада. По дороге домой мышонок тоже говорит только про свой день рождения. Потом он спрашивает:</p><p class="p1">– Мам, а вы подарите мне велосипед?</p><p class="p1">– Это секрет, – говорит мама. – Наступит день рождения – тогда всё узнаешь.</p><p class="p1">Тим задумался. Что же мама с папой для него приготовили?</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_006.jpg"/>
</div><p class="empty-line"/><p class="p1">Дома Тим с мамой делают приглашения для друзей. Тим вырезает, а мама подписывает.</p><p class="p1">Но думает Тим только о подарке. Неужели у него правда будет велосипед?</p><p class="p1">– Мам, а можешь хотя бы намекнуть самую чуточку, что вы приготовили? – спрашивает Тим.</p><p class="p1">– Не могу, иначе сюрприза не получится. Будь внимательнее, Тим, а то порежешься.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_007.jpg"/>
</div><p class="empty-line"/><p class="p1">Потом мама стала делать печенье к празднику. Тим ей помогает.</p><p class="p1">– Давай приготовим много-много печенья, твои друзья же его любят, да, Тим? – говорит мама. – Ну чего ты затих, малыш? Не переживай, мы с папой устроим тебе замечательный день рождения!</p><p class="p1">Но Тим не слушает. На уме у него только велосипед. Ему даже хочется сделать печенье в форме велосипеда!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_008.jpg"/>
</div><p class="empty-line"/><p class="p1">Папа пришёл пожелать мышонку Тиму спокойной ночи.</p><p class="p1">– Знаешь, что мне вчера приснилось? Велосипед! Здорово, правда? Это же хорошо, когда у тебя есть велосипед? – хитро спрашивает Тим.</p><p class="p1">Папа посмеивается:</p><p class="p1">– Да, думаю, велосипед – это неплохо.</p><p class="p1">– Значит, вы мне его подарите?</p><p class="p1">– Тим, пусть наш подарок останется сюрпризом. Так же интереснее, правда?</p><p class="p1">Мышонок нехотя кивает.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_009.jpg"/>
</div><p class="empty-line"/><p class="p1">На следующий день Тим вместе с Джоди побежал к магазину игрушек. Там в витрине стоит тот самый велосипед, о котором мечтает Тим. Вот только… Велосипеда в витрине больше нет!</p><p class="p1">– Наверно, его купил кто-то другой, – говорит Джоди. – Ну, может, тебе подарят велосипед на следующий день рождения.</p><p class="p1">От обиды Тим заплакал. Кто-то забрал его велосипед и теперь на нём катается!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_010.jpg"/>
</div><p class="empty-line"/><p class="p1">Ребята в детском саду заметили, что Тим грустит, и тут же принялись его утешать.</p><p class="p1">– Не грусти! Даже если мама с папой не подарят тебе велосипед, наверняка они приготовили другой чудесный подарок. А ещё они накроют на стол, придёт много гостей, ты задуешь свечки на торте – будет весело, вот увидишь!</p><p class="p1">Тим кивает. Но ведь он так мечтал о велосипеде…</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_011.jpg"/>
</div><p class="empty-line"/><p class="p1">День рождения уже завтра, но Тим до сих пор немного огорчён.</p><p class="p1">Он раздал всем приглашения на праздник.</p><p class="p1">– Приходите ко мне. Будем есть печенье и конфеты. А ещё мы с папой подготовили всякие игры и развлечения.</p><p class="p1">Ребята с радостью согласились прийти и ещё раз уверили Тима, что будет очень весело.</p><p class="p1">«Да, хорошо, что придут все-все друзья, – думает мышонок. – Но всё равно без велосипеда – это уже не то».</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_012.jpg"/>
</div><p class="empty-line"/><p class="p1">Ночью Тим ворочается в кровати. Он так расстроен, что никак не может заснуть.</p><p class="p1">«Даже если мне много-много всего подарят, велосипеда-то не будет, – вздыхает мышонок. – А я ведь так долго ждал этого дня. Теперь на моём велосипеде катается кто-то ещё. Какой-то другой, счастливый мышонок…»</p><p class="p1">Тиму себя ужасно жалко. Он обнимает медвежонка и всё-таки засыпает.</p><p class="p1">А утром…</p><p class="p1">– С днём рождения! – кричат мама и папа.</p><p class="p1">Мышонок открывает глаза.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_013.jpg"/>
</div><p class="empty-line"/><p class="p1">– Сюрприз! – радостно говорят мама и папа.</p><p class="p1">Но Тим не смотрит ни на маму, ни на папу, ни на маленькую сестрёнку. И на торт со свечками тоже. Он видит только одно: велосипед! Тот самый, о котором он мечтал! Новенький, блестящий, с нарядным бантиком! Так, значит, это мама с папой его купили, и это он тот самый счастливый мышонок, который будет на нём кататься!</p><p class="p1">Ура-а-а-а!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_014.jpg"/>
</div><p class="empty-line"/><p class="p1">А потом к Тиму пришли друзья, и все ели печенье и играли. И конечно, пошли кататься на велосипеде.</p><p class="p1">– Хочешь теперь ты? – говорит Тим своему другу Джоди.</p><p class="p1">Тим не жадный – пусть Джоди тоже покатается! Пусть увидит, какой это замечательный велосипед!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_015.jpg"/>
</div><p class="empty-line"/><p class="p1">Праздник кончился, друзья разошлись по домам, а Тим снова побежал во двор кататься. Ему ни капельки не надоедает! Он может так кататься весь день и всю ночь, и даже ещё один день!</p><p class="p1">«Какой замечательный получился день рождения», – думает Тим и быстро-быстро крутит педали.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_016.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_017.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_018.jpg"/>
</div></span>
