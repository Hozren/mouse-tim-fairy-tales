<div class="title">
<p class="p">Анна Казалис</p>
<p class="p">Мышонок Тим капризничает</p>
</div>
<span><div class="image">
<img class="z1" alt="" src="images/i_002.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_003.jpg"/>
</div><p class="empty-line"/><p class="p1">Topo Tip non vuole andare all’asilo</p><p class="p1">From an idea by <div class="image">
<img class="z1" alt="" src="images/i_004.png"/>
</div> Andrea Dami</p><p class="p1">Illustrations by Marco Campanella</p><p class="p1">Texts by Anna Casalis</p><p class="p1">Graphic design by Stefania Pavin</p><p class="p1">© 2018 Giunti Editore S.p.A., Milano-Firenze Dami International, a brand of Giunti Publishing Group www.giunti.it</p><p class="p1">© ООО «РОСМЭН», 2019</p></span>
<span><p class="subtitle">* * *</p><p class="p1">Тим – хороший мышонок, но сегодня у него с самого утра капризное настроение.</p><p class="p1">– Тим, одевайся! – говорит ему мама после завтрака. – Вот тебе свитерок – надень, чтобы не замёрзнуть на прогулке.</p><p class="p1">– Не хочу свитер! Мне и так хорошо! – кричит Тим.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_005.jpg"/>
</div><p class="empty-line"/><p class="p1">– Ну смотри, – вздыхает мама. – Но если будет холодно, сразу пойдём домой. – А потом добавляет: – Только сначала убери за собой игрушки.</p><p class="p1">– Это не я их разбросал, а медвежонок Тедди! – выдумывает Тим и показывает на плюшевого мишку. – И вообще мне нравится беспорядок, так удобнее: все игрушки сразу видно!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_006.jpg"/>
</div><p class="empty-line"/><p class="p1">Наконец мама с Тимом выходят из дома, но Тим и на улице капризничает.</p><p class="p1">– Мама, купи мне игрушку!</p><p class="p1">– У тебя и так много игрушек, – говорит мама.</p><p class="p1">– А я хочу! Хочу! Купи мне жёлтую уточку!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_007.jpg"/>
</div><p class="empty-line"/><p class="p1">Но уточку мама не купила. Зато разрешила Тиму прокатиться один круг на карусели. Но какой там один круг! Он прокатился уже пять раз и никак не хочет слезать.</p><p class="p1">– Тим, нам пора! Смотри, все дети уже разошлись по домам, – говорит мама.</p><p class="p1">– А я хочу ещё! Я на поросёнке не катался! – закричал Тим и сердито скрестил лапки на груди.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_008.jpg"/>
</div><p class="empty-line"/><p class="p1">Когда Тим слез с карусели, он увидел мороженщика.</p><p class="p1">– Хочу мороженое! Фисташковое! Большое-пребольшое!</p><p class="p1">Мышонок Тим изо всех сил тянет маму за лапу.</p><p class="p1">– Сейчас не время для мороженого, Тим, мы скоро пойдём домой, у нас на обед вкусный морковный суп, – говорит мама, но Тим не хочет ничего слышать.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_009.jpg"/>
</div><p class="empty-line"/><p class="p1">– Эй, Тим, давай поиграем в мячик! – зовут его друзья.</p><p class="p1">– Мячик мой, я сам буду с ним играть! – отвечает мышонок.</p><p class="p1">Друзья уходят. А играть одному скучно.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_010.jpg"/>
</div><p class="empty-line"/><p class="p1">– Пойдём, Тим, нам пора! – зовёт мышонка мама.</p><p class="p1">– Я устал, возьми меня на ручки! Я не хочу идти сам! – Тим изо всех сил упирается лапками в землю.</p><p class="p1">И тут мама начинает терять терпение.</p><p class="p1">– Да что с тобой сегодня, Тим? Что же ты всё время капризничаешь? Я устала и не могу тебя нести. Пойдём домой, нас папа ждёт.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_011.jpg"/>
</div><p class="empty-line"/><p class="p1">– А я не пойду домой! Мы с моим мишкой ещё не нагулялись!</p><p class="p1">– Уже холодно и скоро стемнеет. А мне ещё надо приготовить ужин, – уговаривает мышонка мама.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_012.jpg"/>
</div><p class="empty-line"/><p class="p1">– Не-е-е-ет! Не пойду! Я буду гулять!</p><p class="p1">И Тим убегает, прижимая к себе медвежонка.</p><p class="p1">– Ти-и-им! Ты где? Иди сюда скорее! – зовёт мама.</p><p class="p1">Она не на шутку перепугалась. Куда делся малыш? Мама бегает и ищет его. Но Тим притаился за кустом и молчит.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_013.jpg"/>
</div><p class="empty-line"/><p class="p1">Уже совсем стемнело. Стало холодно. И почему он не надел свитер? Мышонок выбирается из своего укрытия, но мамы не видит.</p><p class="p1">– Мама! Мамочка! – зовёт мышонок.</p><p class="p1">Кругом совсем темно. Мышонку кажется, что из темноты на него смотрят злые чудовища.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_014.jpg"/>
</div><p class="empty-line"/><p class="p1">– Мама! Ма-а-а-м-а-а-а! – кричит Тим. – Где ты?</p><p class="p1">И тут к нему прибегают мама с папой. Папа принёс фонарь и нашёл сыночка.</p><p class="p1">– Вот ты где, Тим! Мы так долго тебя искали!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_015.jpg"/>
</div><p class="empty-line"/><p class="p1">Родители бросаются его обнимать, и Тим прижимается к ним.</p><p class="p1">– Я никогда не буду капризничать! И ни за что больше не убегу! – обещает Тим.</p><p class="p1">А мама и папа его обнимают. Как хорошо, что всё хорошо закончилось!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_016.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_017.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_018.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_019.jpg"/>
</div></span>
