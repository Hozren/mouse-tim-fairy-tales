<div class="title">
<p class="p">Анна Казалис</p>
<p class="p">Мышонок Тим не хочет убираться</p>
</div>
<span><div class="image">
<img class="z1" alt="" src="images/i_002.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_003.jpg"/>
</div><p class="empty-line"/><p class="p1">Topo Tip. Non voglio mettere in ordine!</p><p class="p1">Copyright © 2021 Giunti Editore S.p.A., Milano-Firenze</p><p class="p1">Dami International, a brand of Giunti Publishing Group</p><p class="p1">www.giunti.it</p><p class="p1">© ООО «РОСМЭН», 2021</p></span>
<span><p class="subtitle">* * *</p><p class="p1">Мышонок Тим очень любит ходить в детский сад. Там у него много друзей: хомячок Хьюго, ежишка Тесса, крольчишка Фипси и барсучок Диди. А ещё в детском саду всегда много интересного. Сегодня, например, они рисуют акварелью.</p><p class="p1">– У меня будет зелёное дерево!</p><p class="p1">– А у меня домик! – кричат малыши.</p><p class="p1">– А я нарисую нас с папой и подарю картинку ему, – объявляет Тим и обмакивает кисточку в воду.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_004.jpg"/>
</div><p class="empty-line"/><p class="p1">Все сосредоточенно рисуют. Наконец воспитательница говорит:</p><p class="p1">– Всё, убирайте краски, выливайте воду из баночек. Давайте наведём порядок все вместе.</p><p class="p1">– Я уберу краски в шкаф! – вызывается Хьюго.</p><p class="p1">Фипси уже тащит большую банку с водой.</p><p class="p1">– Несите мне кисточки, я их хорошенько вымою!</p><p class="p1">Диди и Тесса развешивают рисунки, чтобы краска высохла.</p><p class="p1">Что же делает мышонок Тим? Он даже не думает помогать другим.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_005.jpg"/>
</div><p class="empty-line"/><p class="p1">– Пф! Убираться – неинтересно, – ворчит он. – Я лучше ещё порисую.</p><p class="p1">Друзья Тима водят хоровод и поют. Тиму тоже хочется.</p><p class="p1">– Я с вами! Подождите меня! – кричит Тим.</p><p class="p1">Он быстро-быстро покидал в ящик краски, кисточки и даже баночку с водой туда сунул.</p><p class="p1">– Ну вот всё и убрано! И не надо долго возиться! – объявляет Тим и бежит к друзьям.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_006.jpg"/>
</div><p class="empty-line"/><p class="p1">Но тут к нему подходит воспитательница.</p><p class="p1">– Тим, ты же знаешь: прежде чем начать новую игру, надо убрать за собой. И сделать это хорошо, а не кое-как.</p><p class="p1">Она видела, что Тим просто всё запихнул в ящик.</p><p class="p1">Другие дети бросили играть. Они смотрят на Тима.</p><p class="p1">– Тим мне не нравится, – тихо говорит одна девочка.</p><p class="p1">Мышонок Тим недовольно надулся и скрестил лапки на груди.</p><p class="p1">– А я не хочу сейчас убираться!</p><p class="p1">Вдруг Фипси воскликнула:</p><p class="p1">– Смотрите! Из ящика вода течёт!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_007.jpg"/>
</div><p class="empty-line"/><p class="p1">Ох! Тим оставил свой рисунок рядом с ящиком, а не повесил сушиться, как все. Баночка опрокинулась, вода вытекла и залила его рисунок.</p><p class="p1">– Всё пропало! Мой рисунок совсем испортился!</p><p class="p1">Воспитательница пытается утешить Тима:</p><p class="p1">– Не расстраивайся, завтра нарисуешь папе новую картинку, ещё лучше.</p><p class="p1">Но Тим только печально качает головой.</p><p class="p1">– Лучше не получится! Я так уже не нарисую! И мне нечего показать папе. Всё из-за этого дурацкого ящика!</p><p class="p1">– Ну что ты говоришь, Тим? – укоряет его воспитательница. – Ты же сам понимаешь, что дело не в ящике. Если бы ты всё хорошо убрал вместе со всеми, ничего бы не случилось.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_008.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим расстроен.</p><p class="p1">– Сегодня – плохой день, – жалуется Тим дома своему медвежонку Тедди.</p><p class="p1">В комнату к Тиму заходит его сестрёнка Лили.</p><p class="p1">– Давай играть в догонялки! – предлагает Тим.</p><p class="p1">– Нет, тут совсем нет места, – говорит рассудительная сестрёнка. – Тем более мы сейчас будем есть. Мама просит тебя убрать игрушки перед ужином.</p><p class="p1">– Ничего я не буду убирать! – кричит Тим. Опять к нему пристают с уборкой! Он очень злится. – Я уберусь, когда захочу, и не надо мне указывать!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_009.jpg"/>
</div><p class="empty-line"/><p class="p1">Вот и вечер. Пора спать. Тим надел пижаму и лёг в кроватку. Мама пришла пожелать ему спокойной ночи и застыла на пороге.</p><p class="p1">– Тим! Почему ты не убрался?</p><p class="p1">– Я убирался, а Тедди опять всё разбросал, – бормочет Тим и краснеет.</p><p class="p1">– Тим, ну как тебе не стыдно! – Мама качает головой. – И не убрался, и сваливаешь всё на мишку. Ладно, сегодня уже слишком поздно, но обещай мне, что завтра ты наведёшь порядок в своей комнате.</p><p class="p1">– Обещаю, – шепчет Тим.</p><p class="p1">Мама почитала Тиму перед сном и крепко его обняла.</p><p class="p1">– Спи, мой мышонок.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_010.jpg"/>
</div><p class="empty-line"/><p class="p1">Утром Тим никак не может найти свою игрушку.</p><p class="p1">– Где мой Супермыш? Тедди, признавайся, это ты его спрятал?!</p><p class="p1">Тим перерыл всю комнату. Тут и раньше был беспорядок, а теперь даже ступить некуда.</p><p class="p1">– Ну где он?! – злится Тим. – Я хотел показать Супермыша своим друзьям в детском саду. Наверное, это Лили его взяла!</p><p class="p1">Тим прибежал в комнату сестрёнки. У Лили порядок, даже кроватка уже аккуратно застелена.</p><p class="p1">Тим кинулся к ящику и стал выбрасывать оттуда игрушки одну за другой.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_011.jpg"/>
</div><p class="empty-line"/><p class="p1">– Что ты делаешь?! – закричала Лили. – Прекрати сейчас же! И зачем ты трогаешь мою одежду! – Тим уже добрался до шкафа с вещами.</p><p class="p1">На шум пришла мама.</p><p class="p1">– Что такое? Тим! Это ты устроил здесь такой тарарам?!</p><p class="p1">– Ничего я не устраивал, – ворчит Тим. – Лили украла моего Супермыша и спрятала. Но я его сейчас найду.</p><p class="p1">– Не брала я никакого Супермыша! – кричит Лили. Из глаз у неё льются слезы.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_012.jpg"/>
</div><p class="empty-line"/><p class="p1">Мама подходит к Тиму и присаживается на корточки.</p><p class="p1">– Скажи мне, что с тобой? Ты ссоришься с сестрёнкой, не хочешь убираться.</p><p class="p1">– Ничего со мной… – ворчит Тим.</p><p class="p1">Мама обнимает мышонка.</p><p class="p1">– Давай ты сейчас уберёшь вещи Лили, которые раскидал, а потом займёшься своей комнатой. И не откладывай, а то друзья в детском саду тебя заждутся.</p><p class="p1">Тиму очень хочется поскорее к друзьям.</p><p class="p1">– Ладно, я уберусь, – говорит Тим. – Идём, Тедди.</p><p class="p1">И только Тим начал убираться в своей комнате, как он нашёл своего Супермыша в куче игрушек!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_013.jpg"/>
</div><p class="empty-line"/><p class="p1">– Мама, Лили! Супермыш нашёлся! – Тим, размахивая игрушкой, вбежал на кухню.</p><p class="p1">– Видишь, как хорошо, – улыбается мама.</p><p class="p1">– Лили, прости, что я подумал, будто это ты его взяла. И что устроил… тарарам в твоей комнате. Я больше так не буду, – говорит мышонок Тим и протягивает сестре лапу. – Мир?</p><p class="p1">– Мир! – Лили пожимает его лапу и смеётся.</p><p class="p1">– Вот и прекрасно! – говорит мама. – Молодцы, что помирились. А теперь – в детский сад!</p><p class="p1">В детском саду Тим нарисовал новую картинку для папы – красную пожарную машину!</p><p class="p1">«Папе точно понравится!» – думает Тим. Он очень собой доволен.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_014.jpg"/>
</div><p class="empty-line"/><p class="p1">Друзья зовут его играть.</p><p class="p1">– Сейчас, только уберу краски, – говорит Тим.</p><p class="p1">Он аккуратно выливает воду из баночки в раковину, моет банку и ставит на полку. Кисточки и краски он кладёт в ящик, а рисунок вешает сушиться.</p><p class="p1">Вот теперь можно играть.</p><p class="p1">Тим убегает, а остальные его догоняют. Тут много места – можно играть в догонялки!</p><p class="p1">«Сегодня хороший день!» – решает Тим.</p><p class="p1">А ты как думаешь, почему?</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_015.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_016.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_017.jpg"/>
</div></span>
