<div class="title">
<p class="p">Анна Казалис</p>
<p class="p">Мышонок Тим. Новогодняя книга</p>
</div>
<span><div class="image">
<img class="z1" alt="" src="images/i_002.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_003.jpg"/>
</div><p class="empty-line"/><p class="p1">Il Natale di Topo Tip</p><p class="p1">Topo Tip. Dov’è Babbo Natale?</p><p class="p1">From an idea by <div class="image">
<img class="z1" alt="" src="images/i_004.png"/>
</div> Andrea Dami</p><p class="p1">Illustrations by Marco Campanella</p><p class="p1">Texts by Anna Casalis</p><p class="p1">Graphic design by Stefania Pavin</p><p class="p1">© 2021 Giunti Editore S.p.A., Milano-Firenze Dami International, a brand of Giunti Publishing Group www.giunti.it</p><p class="p1">© ООО «РОСМЭН», 2021</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_005.jpg"/>
</div></span>
<span id="id1"><div class="title1">
<p class="p">Мышонок Тим встречает Новый год</p>
</div><div class="image">
<img class="z1" alt="" src="images/i_006.jpg"/>
</div><p class="empty-line"/><p class="p1">В комнату заходит мама.</p><p class="p1">– Тим, ты уже написал письмо Дедушке Морозу?</p><p class="p1">– Ой, забыл!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_007.jpg"/>
</div><p class="empty-line"/><p class="p1">Мышонок Тим ещё не умеет писать, но он может нарисовать, какие подарки хочет. Тим скорее достаёт листочек и цветные карандаши и начинает рисовать. Вот поезд, вот самолёт, много-много сладостей, а ещё шарфик и новая шапочка для мишки.</p><p class="p1">«Надеюсь, Дед Мороз поймёт, что я хочу, – думает мышонок Тим. – И всё это мне подарит!»</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_008.jpg"/>
</div><p class="empty-line"/><p class="p1">– Мама! Мама! Я написал письмо Деду Морозу! – кричит Тим. – Отнесёшь его на почту? А я хочу погулять.</p><p class="p1">– Конечно, малыш. Беги, – разрешает мама.</p><p class="p1">Мышонок Тим надевает тёплую курточку, шапку и шарфик и выходит из дома.</p><p class="p1">– Ого, сколько снега! – радуется Тим. – Я слеплю снеговика, самого красивого снеговика!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_009.jpg"/>
</div><p class="empty-line"/><p class="p1">– Йу-хууу! – Бельчонок съезжает по водосточной трубе и хохочет. – Лучше, чем на американских горках!</p><p class="p1">– Привет, Пип! – кричит ему Тим. Он знает бельчонка, они иногда играют вместе.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_010.jpg"/>
</div><p class="empty-line"/><p class="p1">Тим очень старался, и снеговик получился просто замечательный – выше Тима! И такой милый!</p><p class="p1">– Смотри, Тедди, – говорит Тим своему медвежонку, – мой снеговик немного похож на папу, правда?</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_011.jpg"/>
</div><p class="empty-line"/><p class="p1">Скоро вечер, становится холоднее. Тим дрожит.</p><p class="p1">– Бррр, какой мороз! Я весь замёрз: и лапы, и хвост, и даже усы!</p><p class="p1">Он берёт своего медвежонка и быстро-быстро топает к дому.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_012.jpg"/>
</div><p class="empty-line"/><p class="p1">И вдруг Тим видит птичку.</p><p class="p1">– Фьюти-фью! Как холодно! – говорит птичка. – У меня болит крыло, и я не смогла улететь в тёплые края вместе со своими друзьями. И теперь я замерзаю. Малыш, дай мне, пожалуйста, свой шарфик, чтобы я хоть немного согрелась.</p><p class="p1">Тим любит свой шарфик – отдавать его жалко. Он решил сделать вид, что ничего не слышал. Прошёл мимо и юркнул в дом.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_013.jpg"/>
</div><p class="empty-line"/><p class="p1">Пора спать. Тим лежит в тёплой постельке, но на душе у него противно.</p><p class="p1">– Что с тобой, Тим? – спрашивает мама.</p><p class="p1">– Скажи, а Дед Мороз узнает, если я поступил плохо?</p><p class="p1">– Конечно! Дед Мороз всё знает. Но если ты поступил плохо, ты же можешь исправить свою ошибку, – говорит мама и обнимает мышонка.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_014.jpg"/>
</div><p class="empty-line"/><p class="p1">Утром Тим проснулся рано-рано, схватил свой старый свитер и побежал к маме.</p><p class="p1">– Давай скорее его распустим, а из ниток свяжем шарфик. Мне он очень нужен! Пожалуйста, помоги мне!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_015.jpg"/>
</div><p class="empty-line"/><p class="p1">Мама ловко сделала шарфик. Тим оделся потеплее, посадил Тедди на санки, взял шарф и отправился искать птичку.</p><p class="p1">– Пти-и-и-ичка! – зовёт Тим снова и снова. Но никто не отзывается.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_016.jpg"/>
</div><p class="empty-line"/><p class="p1">Наконец Тим нашёл птичку. Она сидит в сугробе под ёлкой и дрожит.</p><p class="p1">– На, возьми скорее шарфик! – говорит ей Тим.</p><p class="p1">– Боюсь, шарфик мне не поможет, я промёрзла насквозь, – отвечает птичка.</p><p class="p1">Но Тим всё равно обмотал птичку шарфиком, а потом посадил на санки и отвёз домой.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_017.jpg"/>
</div><p class="empty-line"/><p class="p1">– Мама, мама, я привёз замёрзшую птичку! – кричит Тим с порога.</p><p class="p1">Мама разогрела суп. Тим покормил птичку, и вскоре она совсем отогрелась.</p><p class="p1">– Спасибо вам! – говорит птичка мышонку Тиму и его маме.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_018.jpg"/>
</div><p class="empty-line"/><p class="p1">Наступила новогодняя ночь. Дед Мороз ходил от дома к дому и дарил подарки.</p><p class="p1">Мышонок Тим сладко посапывал под одеялом, как спят все хорошие мышата.</p><p class="p1">А утром он нашёл под ёлочкой и игрушечный поезд, и самолёт, и конфеты, и, конечно, шарфик и новую шапочку для мишки.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_019.jpg"/>
</div></span>
<span id="id2"><div class="title1">
<p class="p">Мышонок Тим ищет Деда Мороза</p>
</div><p class="p1">Как-то солнечным днём мышонок Тим играл в снежки со своими друзьями – Фипси и Диди.</p><p class="p1">– Вот тебе! – кричал Тим, бросая снежок.</p><p class="p1">– Ну держись! – кричал Диди в ответ.</p><p class="p1">– Тим! Диди! – позвала их вдруг Фипси. – Идите сюда!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_020.jpg"/>
</div><p class="empty-line"/><p class="p1">Фипси показала на снег.</p><p class="p1">– Смотрите, какие странные следы.</p><p class="p1">Диди тут же достал лупу. В последнее время ему нравилось играть в детектива, поэтому лупа у него всегда была с собой.</p><p class="p1">– Сейчас разберёмся, – деловито объявил он и принялся изучать следы. – Совершенно ясно, что это не следы велосипеда. Я бы сказал, похоже на сани.</p><p class="p1">– Тут ещё следы копыт, – заметил Тим. – Значит, сани везёт лошадка. Что, если это Дед Мороз? Он при-ехал к нам, и на санях у него – подарки!</p><p class="p1">– А давайте пойдём по следу и найдём Деда Мороза! – воскликнула Фипси.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_021.jpg"/>
</div><p class="empty-line"/><p class="p1">Идти по снегу было тяжеловато и скучно. Тим начал уставать.</p><p class="p1">– Может, спросим кого-нибудь? – предложил он.</p><p class="p1">– Скажите, пожалуйста, вы, случайно, не видели, тут Дед Мороз не проезжал? – спросила Фипси у двух озябших воробушков.</p><p class="p1">– Нет, не видели, – ответили воробушки. – Но мы слышали звон колокольчика неподалёку.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_022.jpg"/>
</div><p class="empty-line"/><p class="p1">Через некоторое время друзья вышли к домику ежей и вежливо постучали.</p><p class="p1">– Скажите, пожалуйста, тут Дед Мороз не проезжал? – спросила Фипси, когда ежиха выглянула наружу.</p><p class="p1">– Нет, малыши, мы его не видели. Да и вряд ли он приедет так рано – мы ещё даже ёлку не нарядили. Но спросите у лис. Может, они видели.</p><p class="p1">Друзья спросили у лис, а потом у старой мудрой совы, которая спит днём и заметила бы, если бы Дед Мороз проезжал ночью, – но никто, совсем никто его не видел.</p><p class="p1">– Может, это не Дед Мороз, – засомневался Тим. – Может, просто кто-то поехал в лес за дровами…</p><p class="p1">– Всё может быть, но сдаваться рано! – решительно заявила Фипси.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_023.jpg"/>
</div><p class="empty-line"/><p class="p1">– Давайте снова пойдём по следу и посмотрим, куда он нас приведёт, – сказал Диди.</p><p class="p1">Они шли и шли и наконец увидели скромный домик в стволе старого дерева. Тут не было ни гирлянд, ни огоньков, как будто обитатели дома и не думали про Новый год.</p><p class="p1">– По-моему, здесь живёт Дедушка Барсук, наш дальний родственник, – сказал Диди. – Говорят, он почти не выходит из дома.</p><p class="p1">Фипси постучала. Дедушка Барсук выглянул в окошко.</p><p class="p1">– Здравствуйте, малыши.</p><p class="p1">– Здравствуйте! Вы не видели Деда Мороза? – спросили друзья хором.</p><p class="p1">Дедушка Барсук улыбнулся и пригласил их в дом.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_024.jpg"/>
</div><p class="empty-line"/><p class="p1">– Ой, как у вас холодно! – Тим даже поёжился.</p><p class="p1">В доме у Дедушки Барсука действительно было холодно и неуютно. Огонь в очаге не горел. Малыши вспомнили свои дома, как в них тепло, сколько везде игрушек и всяких вещей, как там пахнет ёлочкой и вкусной едой.</p><p class="p1">– Дед Мороз давненько ко мне не заглядывал, – со вздохом сказал Дедушка Барсук. – Оно и понятно: он занят – надо же сперва подарить подарки всем малышам. А к старику заглянуть не успевает.</p><p class="p1">«Бедный Дедушка Барсук! – подумал Тим. – Он тут совсем один!»</p><p class="p1">Близился вечер. Малыши стали прощаться с Дедушкой Барсуком.</p><p class="p1">– Приходите в гости! – сказал он на прощание.</p><p class="p1">Друзья помахали лапками и поспешили назад по своим следам.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_025.jpg"/>
</div><p class="empty-line"/><p class="p1">– А давайте сделаем для Дедушки Барсука что-то очень хорошее, – сказал Тим друзьям по дороге домой.</p><p class="p1">– Можно украсить его дом к Новому году, – предложила Фипси, и все согласились, что это отличная идея.</p><p class="p1">– Где это вы так долго были? – спросил папа мышонка Тима. – Я уже начал волноваться.</p><p class="p1">– Мы искали Деда Мороза! – ответил Тим.</p><p class="p1">Папа улыбнулся:</p><p class="p1">– И как, нашли?</p><p class="p1">– Нет. Но зато мы нашли кое-кого другого. Достань нам, пожалуйста, сундук с чердака, – попросил Тим.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_026.jpg"/>
</div><p class="empty-line"/><p class="p1">В сундуке чего только не было: ленты, золотистые звёздочки, цветные шнурочки. Малыши достали ножницы, клей и цветную бумагу и сделали много-много замечательных украшений.</p><p class="p1">– Может, ещё испечь для него печенье? – задумчиво проговорил Тим. – Я попрошу маму – она поможет.</p><p class="p1">Мама сделала тесто, а потом они с Фипси стали его раскатывать. Тим и Диди с помощью формочек вырезали печенье. Мама поставила его в духовку, и через некоторое время печенье подрумянилось. Мама сложила его на тарелку, и малыши взяли по одной штучке – надо же попробовать, как получилось!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_027.jpg"/>
</div><p class="empty-line"/><p class="p1">И вот Фипси, Диди и Тим снова идут по лесу, но на этот раз они несут подарки.</p><p class="p1">Тук-тук-тук, – постучала Фипси.</p><p class="p1">Как же удивился Дедушка Барсук, когда открыл дверь.</p><p class="p1">– Ого-го! Да ко мне не один Дед Мороз пришёл, а целых три, – рассмеялся он, увидев малышей с подарками. – Входите, входите скорее. Давайте посмотрим, что вы такое принесли.</p><p class="p1">Тим, Фипси и Диди вошли в дом. Сейчас они развесят украшения, и будет красиво и празднично!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_028.jpg"/>
</div><p class="empty-line"/><p class="p1">Дедушка Барсук был очень рад. Малыши принесли дрова для очага, и новогодние украшения, и вкусное печенье. Теперь у него будет настоящий Новый год!</p><p class="p1">– Какой у тебя славный мишка, – сказал Дедушка Барсук Тиму. – Как его зовут?</p><p class="p1">– Его зовут Тедди. Он обожает сладкое печенье и интересные истории!</p><p class="p1">Дедушка Барсук улыбнулся:</p><p class="p1">– О, это я тоже люблю! – И он принялся рассказывать малышам чудесные истории и необыкновенные сказки.</p><p class="p1">В какой-то момент Тиму показалось, что снаружи слышится звон колокольчика, но, может быть, просто показалось.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_029.jpg"/>
</div><p class="empty-line"/><p class="p1">Наступил вечер, малыши стали прощаться с Дедушкой Барсуком. Им пора было по домам. Совсем скоро наступит Новый год, и Дедушка Мороз привезёт подарки – и Тиму, и Диди, и Фипси, и всем-всем-всем.</p><p class="p1">– До свидания! С наступающим! – закричали малыши на прощание. – Мы к вам ещё придём!</p><p class="p1">– Обязательно приходите. Я постараюсь вспомнить ещё какие-нибудь сказки, – пообещал Дедушка Барсук.</p><p class="p1">– А мы испечём печенье!</p><p class="p1">– С Новым годом, малыши! Спасибо вам!</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_030.jpg"/>
</div><p class="empty-line"/><p class="p1">Дома у наряженной ёлки Тима ждали папа, мама и сестрёнка. А под ёлкой лежали подарки.</p><p class="p1">– Смотри, Тим, Дед Мороз уже приходил, – сказала мама.</p><p class="p1">– О-о! Ничего себе, сколько подарков! – закричал Тим.</p><p class="p1">Папа хитро прищурился:</p><p class="p1">– Видимо, Дед Мороз узнал, что ты помог Дедушке Барсуку, малыш.</p><p class="p1">– А я всё-таки думаю, что это сам Дед Мороз нас к нему направил, – сказал Тим. – И я очень рад, что так получилось. Делать добрые дела – это здорово!</p><p class="p1">– И не только под Новый год, – добавила мама и крепко обняла Тима.</p><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_031.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_032.jpg"/>
</div><p class="empty-line"/><div class="image">
<img class="z1" alt="" src="images/i_033.jpg"/>
</div></span>
